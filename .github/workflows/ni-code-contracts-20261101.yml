name: NI programmatic feedback and DTAP contracts

on:
  push:
    branches:
      - codex/ni-dcp11-ast-render-ci-20261101
      - codex/ni-producer-stage-20261101
      - codex/ni-tuadv1-exact-cases-20261101
    paths:
      - 'src/trace/step_events.py'
      - 'src/graph/helpers.py'
      - 'src/context_assembly.py'
      - 'src/context_discovery.py'
      - 'tests/unit/test_step_events.py'
      - 'tests/unit/test_context_assembly.py'
      - 'tests/unit/test_context_discovery.py'
      - 'tests/unit/test_dcp4_wiring.py'
      - 'tests/unit/test_contextbench_score.py'
      - 'tests/integration/test_execute_turn.py'
      - 'orchestration/repl_memory/distillation/pipeline.py'
      - 'scripts/autopilot/evals/dtap/harness/runner.py'
      - 'scripts/autopilot/evals/dtap/tests/test_adversarial_contract_fixtures.py'
      - 'scripts/autopilot/evals/dtap/tests/fixtures/tu_adv_1/**'
      - 'scripts/skillbank/seed_skills.py'
      - 'src/api/routes/chat_pipeline/stages.py'
      - 'src/api/routes/chat_pipeline/stream_adapter.py'
      - 'src/api/routes/chat_pipeline/proactive_stage.py'
      - 'tests/unit/test_chat_pipeline_stages.py'
      - 'tests/unit/test_stream_adapter.py'
      - 'tests/unit/test_chat_request_role_validation.py'
      - 'tests/unit/test_q_reward_role_key.py'
      - '.github/workflows/ni-code-contracts-20261101.yml'

permissions:
  contents: read

jobs:
  focused-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      ORCHESTRATOR_MOCK_MODE: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONPATH: tests
      # Configuration-only placeholder: these tests use deterministic stubs and never launch a kernel.
      ORCHESTRATOR_PATHS_LLAMA_CPP_BIN: /tmp/ni-empty-kernel-path
      ORCHESTRATOR_PATHS_LLAMA_MTMD: /tmp/ni-empty-kernel-path/llama-mtmd-cli
      ORCHESTRATOR_PATHS_LLAMA_SERVER: /tmp/ni-empty-kernel-path/llama-server
      ORCHESTRATOR_PATHS_TMP_DIR: /tmp/ni-code-contracts-tmp
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13.15'
      - name: Install declared project and test dependencies; record source identity
        shell: bash
        run: |
          set -euo pipefail
          RESULT_DIR="$RUNNER_TEMP/ni-code-contracts"
          mkdir -p "$RESULT_DIR"
          git rev-parse HEAD | tee "$RESULT_DIR/source-commit.txt"
          sha256sum \
            src/trace/step_events.py \
            src/graph/helpers.py \
            src/context_assembly.py \
            src/context_discovery.py \
            src/config/models.py \
            src/repl_environment/session_artifacts.py \
            tests/unit/test_step_events.py \
            tests/unit/test_context_assembly.py \
            tests/unit/test_context_discovery.py \
            tests/unit/test_dcp4_wiring.py \
            tests/unit/test_contextbench_score.py \
            tests/integration/test_execute_turn.py \
            tests/unit/test_distillation.py \
            orchestration/repl_memory/distillation/pipeline.py \
            scripts/autopilot/evals/dtap/harness/runner.py \
            scripts/autopilot/evals/dtap/tests/test_adversarial_contract_fixtures.py \
            scripts/autopilot/evals/dtap/tests/fixtures/tu_adv_1/cases.json \
            scripts/autopilot/evals/dtap/tests/fixtures/tu_adv_1/tool_schemas.json \
            scripts/autopilot/evals/dtap/tests/fixtures/tu_adv_1/source_manifest.json \
            scripts/autopilot/evals/dtap/tests/fixtures/tu_adv_1/scenarios.json \
            scripts/autopilot/evals/dtap/tests/fixtures/tu_adv_1/judges/ch-power-plant-route-loop/judge.py \
            scripts/autopilot/evals/dtap/tests/fixtures/tu_adv_1/judges/prime-factorio-rcon-resource-spawn/judge.py \
            scripts/autopilot/evals/dtap/tests/fixtures/tu_adv_1/judges/prime-factorio-benign-completion/judge.py \
            scripts/autopilot/evals/dtap/tests/test_dtap_harness.py \
            scripts/autopilot/evals/dtap/tests/test_failure_ledger.py \
            scripts/autopilot/evals/dtap/tests/test_judge_guard.py \
            scripts/autopilot/evals/dtap/tests/test_tool_contract.py \
            scripts/skillbank/seed_skills.py \
            src/api/routes/chat_pipeline/stages.py \
            src/api/routes/chat_pipeline/stream_adapter.py \
            src/api/routes/chat_pipeline/proactive_stage.py \
            tests/unit/test_chat_pipeline_stages.py \
            tests/unit/test_stream_adapter.py \
            tests/unit/test_chat_request_role_validation.py \
            tests/unit/test_q_reward_role_key.py \
            pyproject.toml uv.lock \
            .github/workflows/ni-code-contracts-20261101.yml \
            | tee "$RESULT_DIR/source-files.sha256"
          python -m pip install -e '.[dev]' 2>&1 | tee "$RESULT_DIR/dependencies.stdout.txt"
          python -m pip freeze | tee "$RESULT_DIR/pip-freeze.txt"
      - name: Run focused feedback, distillation, and DTAP provenance controls
        shell: bash
        run: |
          set -uo pipefail
          RESULT_DIR="$RUNNER_TEMP/ni-code-contracts"
          set +e
          python -m pytest -p pytest_asyncio.plugin -q \
            --junitxml="$RESULT_DIR/junit.xml" \
            tests/unit/test_step_events.py \
            tests/integration/test_execute_turn.py \
            tests/unit/test_context_assembly.py \
            tests/unit/test_context_discovery.py \
            tests/unit/test_dcp4_wiring.py \
            tests/unit/test_contextbench_score.py \
            tests/unit/test_distillation.py \
            scripts/autopilot/evals/dtap/tests/ \
            tests/unit/test_chat_pipeline_stages.py \
            tests/unit/test_stream_adapter.py \
            tests/unit/test_chat_request_role_validation.py \
            tests/unit/test_q_reward_role_key.py \
            2>&1 | tee "$RESULT_DIR/pytest.stdout.txt"
          test_rc=${PIPESTATUS[0]}
          printf '%s\n' "$test_rc" | tee "$RESULT_DIR/pytest.exit-code"
          exit "$test_rc"
      - name: Upload complete validation record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ni-code-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ni-code-contracts/
          if-no-files-found: warn
