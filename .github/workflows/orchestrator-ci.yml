name: Orchestrator CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: "true"
      ORCHESTRATOR_MOCK_MODE: "1"
      EPYC_MODEL_FREE_CI: "1"
      MODEL_LAUNCH_GUARD_OUTPUT: ${{ runner.temp }}/model-free-guard
      MODEL_FREE_MODEL_REGISTRY: ${{ github.workspace }}/app/orchestration/model_registry.yaml
      PYTHONDONTWRITEBYTECODE: "1"
      TMPDIR: ${{ runner.temp }}
      RUFF_CACHE_DIR: ${{ runner.temp }}/ruff-cache
      UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
      UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/orchestrator-venv
      PYTHONHASHSEED: "0"
      PYTEST_XML: ${{ runner.temp }}/orchestrator-junit.xml
      COVERAGE_FILE: ${{ runner.temp }}/orchestrator-coverage-data
      CI_NATIVE_DIR: ${{ runner.temp }}/orchestrator-ci-native
      CI_CONTEXT: ${{ runner.temp }}/orchestrator-ci-context.json
      CI_DEPENDENCIES: ${{ runner.temp }}/orchestrator-ci-dependencies.txt
      CI_EXPORTER_PATHS: ${{ runner.temp }}/orchestrator-ci-exporter-paths.txt
      PYTHONPATH: ${{ github.workspace }}/carrier/scripts/ci
      APP_DIR: ${{ github.workspace }}/app
      EPYC_ROOT: ${{ github.workspace }}/carrier
    defaults:
      run:
        working-directory: ${{ github.workspace }}/app
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout public CI evidence carrier
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-root
          ref: b4e48011d4d935f2d83c373827245bd64b38b92d
          path: carrier
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install locked Python dependencies
        run: |
          python -m pip install uv==0.13.5
          uv sync --frozen

      - name: Set the reviewed format baseline
        run: |
          baseline_head=$(python -c 'import json; print(json.load(open("tests/ci/orchestrator-baseline.json"))["source_head"])')
          git cat-file -e "$baseline_head^{commit}"
          echo "FORMAT_BASE=$baseline_head" >> "$GITHUB_ENV"
          echo "ORCHESTRATOR_BASELINE_HEAD=$baseline_head" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install gate tools
        shell: bash
        run: |
          gate_tools="$RUNNER_TEMP/ci-gate-tools"
          mkdir -p "$gate_tools/bin"
          curl --fail --location --silent --show-error \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            --output "$gate_tools/shellcheck.tar.xz"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $gate_tools/shellcheck.tar.xz" | sha256sum --check
          tar -xJf "$gate_tools/shellcheck.tar.xz" -C "$gate_tools" shellcheck-v0.11.0/shellcheck
          cp "$gate_tools/shellcheck-v0.11.0/shellcheck" "$gate_tools/bin/shellcheck"
          curl --fail --location --silent --show-error \
            https://github.com/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_linux_amd64 \
            --output "$gate_tools/bin/shfmt"
          echo "76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf  $gate_tools/bin/shfmt" | sha256sum --check
          chmod +x "$gate_tools/bin/shfmt"
          node -e 'if (Number(process.versions.node.split(".")[0]) < 20) process.exit(1)'
          npm install --prefix "$gate_tools" --cache "$RUNNER_TEMP/npm-cache" \
            --no-audit --no-fund markdownlint-cli@0.45.0
          echo "$gate_tools/bin" >> "$GITHUB_PATH"
          echo "$gate_tools/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Run repository gates
        run: uv run --locked make gates

      - name: Snapshot checkout before tests
        if: always()
        run: |
          git -C "$APP_DIR" status --porcelain --ignored --untracked-files=all > "$RUNNER_TEMP/app-status-before-tests"
          git -C "$EPYC_ROOT" status --porcelain --ignored --untracked-files=all > "$RUNNER_TEMP/carrier-status-before-tests"

      - name: Record the test command context
        if: always()
        run: |
          uv_version=$(uv --version)
          app_python_version=$(uv run --locked python -c 'import platform; print(platform.python_version())')
          pytest_version=$(uv run --locked python -c 'import pytest; print(pytest.__version__)')
          ruff_version=$(uv run --locked ruff --version)
          shellcheck_version=$(shellcheck --version | tail -n 1)
          shfmt_version=$(shfmt --version)
          markdownlint_version=$(markdownlint --version)
          export UV_VERSION="$uv_version" APP_PYTHON_VERSION="$app_python_version"
          export PYTEST_VERSION="$pytest_version" RUFF_VERSION="$ruff_version"
          export SHELLCHECK_VERSION="$shellcheck_version" SHFMT_VERSION="$shfmt_version"
          export MARKDOWNLINT_VERSION="$markdownlint_version"
          uv pip freeze --python "$UV_PROJECT_ENVIRONMENT/bin/python" > "$CI_DEPENDENCIES"
          uv run --locked python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import _pytest.junitxml
          import _pytest.subtests

          baseline = json.loads(Path("tests/ci/orchestrator-baseline.json").read_text())
          lock_hash = hashlib.sha256(Path("uv.lock").read_bytes()).hexdigest()
          env_keys = [
              "CI", "ORCHESTRATOR_MOCK_MODE", "PYTHONDONTWRITEBYTECODE", "PYTHONHASHSEED", "TMPDIR",
              "RUFF_CACHE_DIR", "UV_CACHE_DIR", "COVERAGE_FILE", "PYTEST_XML", "CI_NATIVE_DIR", "CI_CONTEXT",
              "UV_PROJECT_ENVIRONMENT", "APP_DIR", "APP_PYTHON_VERSION",
              "EPYC_ROOT", "PYTHONPATH", "CI_DEPENDENCIES", "CI_EXPORTER_PATHS",
              "EPYC_MODEL_FREE_CI", "MODEL_LAUNCH_GUARD_OUTPUT", "MODEL_FREE_MODEL_REGISTRY",
              "SHELLCHECK_VERSION", "SHFMT_VERSION", "MARKDOWNLINT_VERSION",
              "FORMAT_BASE", "ORCHESTRATOR_BASELINE_HEAD",
              "PATH", "HOME", "GITHUB_ACTIONS", "GITHUB_RUN_ID", "GITHUB_JOB",
              "GITHUB_RUN_ATTEMPT", "GITHUB_SHA", "GITHUB_REF", "GITHUB_EVENT_NAME",
              "GITHUB_BASE_REF", "GITHUB_HEAD_REF",
          ]
          test_argv = [
              "uv", "run", "--locked", "make", "test",
              "PYTEST_ARGS=-n 2 -m 'not requires_server and not requires_live_models and not requires_materialized_trace' "
              "-p no:cacheprovider -p epyc_pytest_junit_compat -p tests.fixtures.model_free_guard --junitxml=" + os.environ["PYTEST_XML"],
          ]
          exporter_paths = [Path(_pytest.junitxml.__file__).resolve(), Path(_pytest.subtests.__file__).resolve()]
          Path(os.environ["CI_EXPORTER_PATHS"]).write_text(
              "".join(str(path) + "\n" for path in exporter_paths), encoding="utf-8"
          )
          context = {
              "schema": "orchestrator-ci-context.v1",
              "tested_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "carrier_commit": subprocess.check_output(["git", "-C", os.environ["EPYC_ROOT"], "rev-parse", "HEAD"], text=True).strip(),
              "pull_request_base_sha": "${{ github.event.pull_request.base.sha }}" or None,
              "reviewed_baseline_source_head": baseline["source_head"],
              "python": os.environ["APP_PYTHON_VERSION"],
              "project_installation": "editable project in isolated UV_PROJECT_ENVIRONMENT",
              "uv": os.environ["UV_VERSION"],
              "pytest": os.environ["PYTEST_VERSION"],
              "junit_compatibility_plugin": "epyc_pytest_junit_compat",
              "junit_exporter_sources": {str(path): hashlib.sha256(path.read_bytes()).hexdigest() for path in exporter_paths},
              "dependency_inventory_sha256": hashlib.sha256(Path(os.environ["CI_DEPENDENCIES"]).read_bytes()).hexdigest(),
              "ruff": os.environ["RUFF_VERSION"],
              "shellcheck": os.environ["SHELLCHECK_VERSION"],
              "shfmt": os.environ["SHFMT_VERSION"],
              "markdownlint": os.environ["MARKDOWNLINT_VERSION"],
              "runner_release": Path("/etc/os-release").read_text(encoding="utf-8"),
              "uv_lock_sha256": lock_hash,
              "install_command": "uv sync --frozen",
              "gates_argv": ["uv", "run", "--locked", "make", "gates"],
              "test_argv": test_argv,
              "ci_environment": {key: os.environ.get(key) for key in env_keys},
              "excluded_markers": baseline["ci_exclusions"],
          }
          Path(os.environ["CI_CONTEXT"]).write_text(
              json.dumps(context, sort_keys=True, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - name: Run complete pytest suite
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t exporter_paths < "$CI_EXPORTER_PATHS"
          test "${#exporter_paths[@]}" -eq 2
          uv run --locked python "$EPYC_ROOT/scripts/ci/native_conformance.py" \
            --cwd "$APP_DIR" \
            --junit "$PYTEST_XML" \
            --output "$CI_NATIVE_DIR" \
            --repo "app=$APP_DIR" \
            --repo "carrier=$EPYC_ROOT" \
            --read-path "$CI_CONTEXT" \
            --read-path "$CI_DEPENDENCIES" \
            --read-path "$CI_EXPORTER_PATHS" \
            --read-path "${exporter_paths[0]}" \
            --read-path "${exporter_paths[1]}" \
            --read-path "$EPYC_ROOT/scripts/ci/epyc_pytest_junit_compat.py" \
            --read-path "$APP_DIR/.github/workflows/orchestrator-ci.yml" \
            --read-path "$APP_DIR/Makefile" \
            --read-path "$APP_DIR/Justfile" \
            --read-path "$APP_DIR/pyproject.toml" \
            --read-path "$APP_DIR/uv.lock" \
            --read-path "$APP_DIR/tests/README.md" \
            --read-path "$APP_DIR/tests/fixtures/model_free_guard.py" \
            --read-path "$APP_DIR/tests/fixtures/api_startup.py" \
            --read-path "$APP_DIR/orchestration/model_registry.yaml" \
            --read-path "$APP_DIR/tests/fixtures/ni63_capacity_child/source_clone.py" \
            --read-path "$APP_DIR/tests/unit/test_orchestrator_stack_import_is_argv_safe.py" \
            --read-path "$APP_DIR/scripts/ci/check_pytest_baseline.py" \
            --read-path "$APP_DIR/scripts/ci/check_ruff_baseline.py" \
            --read-path "$APP_DIR/tests/ci/orchestrator-baseline.json" \
            --select "complete tests/ suite" \
            --select "CI excludes only the three declared host-resource markers" \
            --select "baseline source ${{ env.ORCHESTRATOR_BASELINE_HEAD }}" \
            -- \
            uv run --locked make test \
            "PYTEST_ARGS=-n 2 -m 'not requires_server and not requires_live_models and not requires_materialized_trace' -p no:cacheprovider -p epyc_pytest_junit_compat -p tests.fixtures.model_free_guard --junitxml=$PYTEST_XML"

      - name: Reject model-free guard violations
        if: always()
        shell: bash
        run: |
          if [ -d "$MODEL_LAUNCH_GUARD_OUTPUT" ] && [ -n "$(find "$MODEL_LAUNCH_GUARD_OUTPUT" -type f -name 'violation-*.json' -print -quit)" ]; then
            echo "Model-free CI guard refused a production model operation."
            exit 1
          fi

      - name: Enforce collection floor and fail only on new test IDs
        if: always()
        run: |
          pytest_status=$(uv run --locked python -c 'import json,sys; print(json.load(open(sys.argv[1]))["exit_code"])' "$CI_NATIVE_DIR/receipt.json")
          uv run --locked python scripts/ci/check_pytest_baseline.py \
            --junit "$CI_NATIVE_DIR/original-junit.xml" \
            --baseline tests/ci/orchestrator-baseline.json \
            --pytest-exit-code "$pytest_status" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Reopen and grade the native receipt through the shared verifier
        if: always()
        run: |
          PYTHONPATH="$EPYC_ROOT:$EPYC_ROOT/scripts/vidya" \
            uv run --locked python - "$CI_NATIVE_DIR/receipt.json" "$RUNNER_TEMP/orchestrator-ci-shared-grade.json" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys
          from adapters.ci_conformance import native_rows, project_ci_conformance
          from claim_tuple import grade

          receipt = Path(sys.argv[1])
          inputs = sorted(receipt.parent.iterdir())
          before = {path.name: hashlib.sha256(path.read_bytes()).hexdigest() for path in inputs if path.is_file()}
          rows = native_rows(receipt)
          if len(rows) != 1:
              raise SystemExit("native receipt did not produce exactly one existing CI conformance row")
          quality, traceability, reasons = grade(project_ci_conformance(rows[0]))
          after = {path.name: hashlib.sha256(path.read_bytes()).hexdigest() for path in inputs if path.is_file()}
          if before != after:
              raise SystemExit("shared verifier modified original native custody")
          Path(sys.argv[2]).write_text(json.dumps({"quality": quality, "traceability": traceability,
              "reasons": reasons, "input_sha256": before}, sort_keys=True, indent=2) + "\n")
          print(json.dumps({"quality": quality, "traceability": traceability}))
          PY

      - name: Ensure tests left no checkout artifacts
        if: always()
        run: |
          git -C "$APP_DIR" status --porcelain --ignored --untracked-files=all > "$RUNNER_TEMP/app-status-after-tests"
          git -C "$EPYC_ROOT" status --porcelain --ignored --untracked-files=all > "$RUNNER_TEMP/carrier-status-after-tests"
          diff -u "$RUNNER_TEMP/app-status-before-tests" "$RUNNER_TEMP/app-status-after-tests"
          diff -u "$RUNNER_TEMP/carrier-status-before-tests" "$RUNNER_TEMP/carrier-status-after-tests"

      - name: Preserve original test output, JUnit, receipt, and shared-grade summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orchestrator-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/orchestrator-ci-native/
            ${{ runner.temp }}/orchestrator-ci-shared-grade.json
            ${{ runner.temp }}/orchestrator-ci-context.json
          if-no-files-found: error
