name: NI KPF-24 native unique-cell contracts

on:
  push:
    branches:
      - codex/ni-kpf24-unique-cells-20261101

permissions:
  contents: read

jobs:
  unique-cells:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      ORCHESTRATOR_MOCK_MODE: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONPATH: tests/unit:tests
      ORCHESTRATOR_PATHS_LLAMA_CPP_BIN: /tmp/ni-kpf24/empty-kernel-path
      ORCHESTRATOR_PATHS_LLAMA_MTMD: /tmp/ni-kpf24/empty-kernel-path/llama-mtmd-cli
      ORCHESTRATOR_PATHS_LLAMA_SERVER: /tmp/ni-kpf24/empty-kernel-path/llama-server
      ORCHESTRATOR_PATHS_TMP_DIR: /tmp/ni-kpf24/app-tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
      - name: Capture source and declared dependencies
        shell: bash
        run: |
          set -euo pipefail
          result_dir="$RUNNER_TEMP/ni-kpf24"
          mkdir -p "$result_dir" "$ORCHESTRATOR_PATHS_TMP_DIR"
          git rev-parse HEAD | tee "$result_dir/source-commit.txt"
          git rev-parse 'HEAD^{tree}' > "$result_dir/source-tree.txt"
          sha256sum src/backends/context_limits.py src/scheduling/kv_pool_admission.py \
            tests/unit/test_kv_prefix_history.py tests/unit/test_kv_pool_unique_cells.py \
            tests/unit/test_prefix_index_flag_off.py \
            .github/workflows/ni-kpf24-unique-cells-20261101.yml pyproject.toml uv.lock \
            > "$result_dir/source-files.sha256"
          python -VV > "$result_dir/python-version.txt" 2>&1
          python -m pip install -e '.[dev]' 2>&1 | tee "$result_dir/dependencies.stdout.txt"
          python -m pip freeze > "$result_dir/pip-freeze.txt"
      - name: Retain immutable-main flag-off comparison
        shell: bash
        run: |
          set -euo pipefail
          result_dir="$RUNNER_TEMP/ni-kpf24"
          candidate_sha=$(git rev-parse HEAD)
          git checkout --detach 29fdfc5a7cc229f1dcafee327f193b1623de0d32
          git rev-parse HEAD > "$result_dir/baseline-source-commit.txt"
          set +e
          python -m pytest -p pytest_asyncio.plugin -q \
            --junitxml="$result_dir/baseline-flag-off.junit.xml" \
            tests/unit/test_prefix_index_flag_off.py \
            2>&1 | tee "$result_dir/baseline-flag-off.stdout.txt"
          baseline_rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$baseline_rc" > "$result_dir/baseline-flag-off.exit-code"
          git checkout --detach "$candidate_sha"
      - name: Focused admission and caller regressions
        shell: bash
        run: |
          set -uo pipefail
          set +e
          result_dir="$RUNNER_TEMP/ni-kpf24"
          python -m pytest -p pytest_asyncio.plugin -q \
            --junitxml="$result_dir/junit.xml" \
            tests/unit/test_kv_pool_unique_cells.py tests/unit/test_kv_prefix_history.py \
            tests/unit/test_prefix_index_admission.py tests/unit/test_prefix_index_review_fixes.py \
            tests/unit/test_prefix_index_flag_off.py tests/unit/test_review_p2b_defects.py \
            tests/unit/test_kv_pool_long_prefill.py tests/unit/test_kv_pool_cross_process_lease.py \
            tests/unit/test_context_overflow_handling.py tests/unit/test_context_limits_model_cap.py \
            2>&1 | tee "$result_dir/pytest.stdout.txt"
          test_rc=${PIPESTATUS[0]}
          printf '%s\n' "$test_rc" > "$result_dir/pytest.exit-code"
          exit "$test_rc"
      - name: Lint changed Python paths
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          set +e
          result_dir="$RUNNER_TEMP/ni-kpf24"
          ruff check src/backends/context_limits.py src/scheduling/kv_pool_admission.py \
            tests/unit/test_kv_prefix_history.py tests/unit/test_kv_pool_unique_cells.py \
            tests/unit/test_prefix_index_flag_off.py \
            2>&1 | tee "$result_dir/ruff.stdout.txt"
          lint_rc=${PIPESTATUS[0]}
          printf '%s\n' "$lint_rc" > "$result_dir/ruff.exit-code"
          exit "$lint_rc"
      - name: Repository gates
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          set +e
          result_dir="$RUNNER_TEMP/ni-kpf24"
          {
            sudo apt-get update && sudo apt-get install -y shfmt && \
              npm install -g markdownlint-cli@0.44.0
            shfmt --version
            shellcheck --version
            markdownlint --version
          } 2>&1 | tee "$result_dir/gate-tools.stdout.txt"
          PYTEST_ADDOPTS="-p pytest_asyncio.plugin --junitxml=$result_dir/gates.junit.xml" \
            make gates 2>&1 | tee "$result_dir/make-gates.stdout.txt"
          gates_rc=${PIPESTATUS[0]}
          printf '%s\n' "$gates_rc" > "$result_dir/make-gates.exit-code"
          candidate_sha=$(git rev-parse HEAD)
          git checkout --detach 29fdfc5a7cc229f1dcafee327f193b1623de0d32 || exit 1
          PYTEST_ADDOPTS="-p pytest_asyncio.plugin --junitxml=$result_dir/baseline-gates.junit.xml" \
            make gates 2>&1 | tee "$result_dir/baseline-make-gates.stdout.txt"
          baseline_rc=${PIPESTATUS[0]}
          printf '%s\n' "$baseline_rc" > "$result_dir/baseline-make-gates.exit-code"
          git checkout --detach "$candidate_sha" || exit 1
          exit "$gates_rc"
      - name: Preserve original validation records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ni-kpf24-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ni-kpf24/
          if-no-files-found: error
