# ═══════════════════════════════════════════════════════════════════
# TOOL-USE SENTINELS  (suite: tool_use)
# ═══════════════════════════════════════════════════════════════════
#
# Each question is answered by calling the `get_eval_secret` tool
# (src/tools/eval_secret.py). The secret VALUES are minted at RUNTIME by the
# orchestrator and held in memory — they are NOT in this file and NOT in source
# (an earlier version hardcoded them here + in eval_secret.py, which let a model
# grep them out of the repo instead of calling the tool). The ground truth is
# persisted only to a tmpfs path outside read_file's allowed roots; eval_tower's
# `_load_tool_sentinels` injects each question's real `expected` from there at
# load time. The placeholder below NEVER matches a real answer, so if ground
# truth is unavailable these score INCORRECT (not spuriously correct on "").
#
# Honest invariant: the AUTHORITATIVE signal is the directly-measured
# get_eval_secret call count (request-local telemetry), NOT answer-correctness —
# runtime generation removes the realistic (grep-the-repo) bypass, and the
# call-count measurement is what guarantees the tool was used.
#
# force_mode: "repl" pins the REPL path; scoring is `substring`.
# EXECUTION DISCIPLINE (gate-3): prompts must demand executable Python that
# calls TOOL("get_eval_secret", name=...) and then FINAL(secret). Earlier prose
# prompts conflicted with force_mode="repl" and caused comment-only/no-progress
# failures despite telemetry being healthy. INERT unless AUTOPILOT_TOOL_SENTINELS=1.

- id: tool_use_secret_alpha
  suite: tool_use
  force_mode: "repl"
  prompt: "You are in a Python REPL. Write executable Python, not prose. The value exists ONLY inside the tool; it is not in this prompt and not in any file. Run exactly this pattern with the requested name, then stop: secret = TOOL(\"get_eval_secret\", name=\"alpha\"); FINAL(secret). Do not print or explain anything after FINAL."
  expected: "__resolved_at_runtime__"
  scoring_method: substring
  scoring_config: {}

