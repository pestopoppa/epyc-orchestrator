# DS-7: Default stack template — matches current stack_manifest.py launch topology.
# This is the production steady-state/static-prewarm baseline retained by the
# DS-E1 profile decision on 2026-07-04.
#
# System: 2×AMD EPYC 9004, 192 cores (384 threads), 1130 GB RAM
# Host CPU shapes are declared in scripts/server/stack_numa.py (_CPU_SHAPES);
# the `numa:` values below name those shapes without the NUMA_ prefix.
#
# 2026-07-30/31 quarter retirement + 2026-08-01 W1 cutover, restated here from
# the compiled artifacts (see the `roles:` note below):
#   * CPU pre-warm roles (frontdoor, worker_general, ingest_long_context) run
#     1×96t FULL instance + 2×48t HALF instances. The four-quarter lineup
#     (8280/8380, 8282/8382, 8385/8485, 8187..8487) was RETIRED and its ports
#     freed — they must not be revived here.
#   * architect_general and worker_vision are MI210 roles: the model is on the
#     GPU and only 8 HOST threads are pinned, on GPU_HOST_LANE (184-191).
#   * architect_critic (:8074) is the whole-machine 122B that vacated
#     architect_general; coder_escalation now aliases architect_general, and
#     vision_escalation aliases worker_vision (both are the SAME server process
#     as their target, not a second instance).
#
# Embedding roles (embedder, embedder_1..5):
#   6×BGE single-port embedding servers, no NUMA pinning, optional at launch
#
# Aliases are represented with tier=ALIAS + alias_to; they do not launch separate servers.
# Single-instance roles: 1×96t full-machine, 1×8t GPU host lane, or embedding-mode dedicated

name: default
description: Production steady-state static-prewarm baseline (DS-E1 retained 2026-07-04) — current manifest topology with explicit aliases
version: "1"

metadata:
  ds7_profile: steady_state_static_prewarm
  ds7_decision:
    status: retain_default
    decided_at: "2026-07-04T19:40:20Z"
    evidence_packet: orchestration/reports/ds_e1_evidence_packet_20260704T192333Z.md
    evidence_packet_json: orchestration/reports/ds_e1_evidence_packet_20260704T192333Z.json
    rationale: DS-E1 packaged stack roster, DS-5 manifest freshness, contention matrix, RI-10 canary evidence, and production KV-size rows with no blockers; no evidence shows static pre-warm leaves a material throughput or latency gap.
    ds6_quarter_scheduler: parked_until_static_prewarm_gap
    validation_command: python3 scripts/server/orchestrator_stack.py start --stack-profile default --validate-only

# Fine-grained resource budget (NIB2-19 / DS-7 Gap 4). Omitting this block
# falls back to system defaults (744 / 930 / 100). System total is 1130 GB.
resource_budget:
  max_mlock_gb: 800    # HOT tier ceiling (production stack uses ~653 GB)
  max_total_gb: 930    # HOT + WARM combined ceiling
  reserve_kv_gb: 100   # minimum headroom for KV caches + OS

roles:
  # Per-role model/quant/ram_gb rows below are compared against
  # orchestration/derived/stack_priors.yaml by the stack-change guard rule
  # `stale_role_fact_table`. Restate them from the compiled artifact; do not
  # hand-maintain them.
  frontdoor:
    model: Qwen3.6-35B-A3B-MTP-Q8_0   # 2026-08-01: was Qwen3.6-35B-A3B-Q8_0 (the NON-MTP GGUF, a different file)
    quant: Q8_0
    tier: HOT
    ram_gb: 37
    full:
      port: 8070
      numa: FULL
      threads: 96
      slot_save_path: /tmp/kv_frontdoor_full
    quarters:
      - { port: 8080, numa: HALF_A, threads: 48 }
      - { port: 8180, numa: HALF_B, threads: 48 }

  coder_escalation:
    # 2026-08-01 W1: moved off frontdoor's 35B onto architect_general's :8083
    # 27B (registry: roles.coder_escalation.alias_of + server_mode
    # architect_general.shared_with) — one process, two names.
    tier: ALIAS
    alias_to: architect_general

  worker_summarize:
    tier: ALIAS
    alias_to: frontdoor

  worker_general:
    model: gemma-4-26B-A4B-it
    quant: Q4_K_M
    tier: HOT
    ram_gb: 16
    full:
      port: 8072
      numa: FULL
      threads: 96
      slot_save_path: /tmp/kv_worker_full
      spec_overrides:
        draft_max: 2
        p_split: 0
    quarters:
      - { port: 8082, numa: HALF_A, threads: 48 }
      - { port: 8182, numa: HALF_B, threads: 48 }

  worker_explore:
    tier: ALIAS
    alias_to: worker_general

  worker_math:
    tier: ALIAS
    alias_to: worker_general

  toolrunner:
    tier: ALIAS
    alias_to: worker_general

  architect_general:
    # 2026-07-31/08-01: repointed to the 27B on MI210; the 122B vacated to the
    # new architect_critic role (:8074). Was Qwen3.5-122B-A10B / Q4_K_M / 69 GB.
    model: Qwen3.6-27B-MTP-Q8_0
    quant: Q8_0
    tier: HOT
    ram_gb: 27.05
    full:
      port: 8083
      numa: GPU_HOST_LANE
      threads: 8
      spec_overrides:
        draft_max: 24
        p_split: 0

  architect_critic:
    # 2026-07-31/08-01: the 122B that used to sit on architect_general. Whole
    # machine, CPU-resident. Terminal rung of the escalation ladder.
    model: Qwen3.5-122B-A10B
    quant: Q4_K_M
    tier: HOT
    ram_gb: 69
    full:
      port: 8074
      numa: FULL
      threads: 96

  ingest_long_context:
    model: Qwen3-Next-80B-A3B
    quant: Q4_K_M
    tier: HOT
    ram_gb: 45
    full:
      port: 8085
      numa: FULL
      threads: 96
    quarters:
      - { port: 8185, numa: HALF_A, threads: 48 }
      - { port: 8285, numa: HALF_B, threads: 48 }

  worker_vision:
    # 2026-07-31: Qwen2.5-VL-7B retired on both vision roles (MMMU-250 52.4% ->
    # 63.6%). Was Qwen2.5-VL-7B / 4.4 GB.
    model: Qwen3-VL-30B-A3B-Instruct
    quant: Q4_K_M
    tier: HOT
    ram_gb: 17.3
    full:
      port: 8086
      numa: GPU_HOST_LANE
      threads: 8

  vision_escalation:
    # 2026-08-01 W1 vision unification: the standalone :8087 instance was
    # retired; the escalation tier rides worker_vision's :8086 MI210 process.
    tier: ALIAS
    alias_to: worker_vision

  embedder:
    model: bge-large-en-v1.5-f16
    quant: f16
    tier: HOT
    mode: embedding
    ram_gb: 0.67
    full:
      port: 8090
      numa: NONE
      threads: 4

  embedder_1:
    model: bge-large-en-v1.5-f16
    quant: f16
    tier: HOT
    mode: embedding
    ram_gb: 0.67
    full:
      port: 8091
      numa: NONE
      threads: 4

  embedder_2:
    model: bge-large-en-v1.5-f16
    quant: f16
    tier: HOT
    mode: embedding
    ram_gb: 0.67
    full:
      port: 8092
      numa: NONE
      threads: 4

  embedder_3:
    model: bge-large-en-v1.5-f16
    quant: f16
    tier: HOT
    mode: embedding
    ram_gb: 0.67
    full:
      port: 8093
      numa: NONE
      threads: 4

  embedder_4:
    model: bge-large-en-v1.5-f16
    quant: f16
    tier: HOT
    mode: embedding
    ram_gb: 0.67
    full:
      port: 8094
      numa: NONE
      threads: 4

  embedder_5:
    model: bge-large-en-v1.5-f16
    quant: f16
    tier: HOT
    mode: embedding
    ram_gb: 0.67
    full:
      port: 8095
      numa: NONE
      threads: 4
