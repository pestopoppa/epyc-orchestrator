# DS-7: Default stack template — matches current stack_manifest.py launch topology
# This is the production baseline that AR-3 Pareto frontiers are compared against.
#
# System: 2×AMD EPYC 9004, 192 cores (384 threads), 1130 GB RAM
# NUMA topology: 2 nodes × 2 quarters = 4 quarters (Q0A, Q0B, Q1A, Q1B)
#
# Pre-warm launch roles (frontdoor, worker_general, ingest_long_context, vision_escalation):
#   1×96t full-speed instance + 4×48t quarter instances
#   ConcurrencyAwareBackend routes single→full, concurrent→quarters
#
# Embedding roles (embedder, embedder_1..5):
#   6×BGE single-port embedding servers, no NUMA pinning, optional at launch
#
# Aliases are represented with tier=ALIAS + alias_to; they do not launch separate servers.
# Architect roles: 1×96t full-machine canonical instance
# Single-instance roles: 1×96t, 1×24t, or embedding-mode dedicated

name: default
description: Production baseline (2026-06-13) — current manifest topology with explicit aliases
version: "1"

# Fine-grained resource budget (NIB2-19 / DS-7 Gap 4). Omitting this block
# falls back to system defaults (744 / 930 / 100). System total is 1130 GB.
resource_budget:
  max_mlock_gb: 800    # HOT tier ceiling (production stack uses ~653 GB)
  max_total_gb: 930    # HOT + WARM combined ceiling
  reserve_kv_gb: 100   # minimum headroom for KV caches + OS

roles:
  frontdoor:
    model: Qwen3.6-35B-A3B-Q8_0
    quant: Q8_0
    tier: HOT
    ram_gb: 37
    full:
      port: 8070
      numa: NODE0
      threads: 96
      slot_save_path: /tmp/kv_frontdoor_full
    quarters:
      - { port: 8080, numa: Q0A, threads: 48 }
      - { port: 8180, numa: Q0B, threads: 48 }
      - { port: 8280, numa: Q1A, threads: 48 }
      - { port: 8380, numa: Q1B, threads: 48 }

  coder_escalation:
    tier: ALIAS
    alias_to: frontdoor

  worker_summarize:
    tier: ALIAS
    alias_to: frontdoor

  worker_general:
    model: gemma-4-26B-A4B-it
    quant: Q4_K_M
    tier: HOT
    ram_gb: 16
    full:
      port: 8072
      numa: FULL
      threads: 96
      slot_save_path: /tmp/kv_worker_full
      spec_overrides:
        draft_max: 2
        p_split: 0
    quarters:
      - { port: 8082, numa: Q0A, threads: 48 }
      - { port: 8182, numa: Q0B, threads: 48 }
      - { port: 8282, numa: Q1A, threads: 48 }
      - { port: 8382, numa: Q1B, threads: 48 }

  worker_explore:
