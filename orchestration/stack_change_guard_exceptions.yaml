# Documented stack-change guard exceptions.
#
# Keep this file sparse. Each exception must be temporary and specific enough to
# preserve the guard signal for unrelated model-stack drift.
#
# production_blocker waivers fail closed unless the validator/pipeline is run
# with --allow-production-blocker-waivers for an intentional emergency exception.
#
# Required fields per entry:
# - rule_id: hardcoded-surface rule id, e.g. retired_role_in_active_code
# - category: production_blocker, legacy_test, or historical_doc
# - path_glob: repository-relative glob for the finding path
# - classification: degraded_fallback, legacy_test, historical_doc, or intentional_live_exception
# - owner: accountable person/team/workstream
# - rationale: why this exception is safer than immediate migration
# - expires: ISO date YYYY-MM-DD
# Optional:
# - line: exact line number for a single-line waiver
#
# NOTE: historical_doc waivers are intentionally absent — the current
# --all-hardcoded-surfaces scan reports 0 historical_doc findings, so a
# historical_doc exception here would be flagged as a stale (unmatched) waiver.
# Add one only when a genuine docs/**/*.md retired-role finding reappears.
exceptions:
  - rule_id: retired_role_in_tests
    category: legacy_test
    path_glob: tests/unit/test_chat_request_role_validation.py
    classification: legacy_test
    owner: test-infrastructure
    rationale: >-
      Intentional retired-role coverage: asserts Role._missing_ resolves the
      legacy "architect_coding" label to live architect_general. This fixture
      must keep the legacy string to prove backward-compatible normalization.
    expires: "2026-12-31"
  - rule_id: retired_role_in_tests
    category: legacy_test
    path_glob: tests/unit/test_q_reward_role_key.py
    classification: legacy_test
    owner: test-infrastructure
    rationale: >-
      Intentional retired-role coverage: iterates the legacy "architect_coding"
      key to prove q-reward role-key handling stays stable for historical
      replay data. Migrating would drop legacy-key regression coverage.
    expires: "2026-12-31"
