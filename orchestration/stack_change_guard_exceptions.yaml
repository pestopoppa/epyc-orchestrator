# Documented stack-change guard exceptions.
#
# Keep this file sparse. Each exception must be temporary and specific enough to
# preserve the guard signal for unrelated model-stack drift.
#
# Required fields per entry:
# - rule_id: hardcoded-surface rule id, e.g. retired_role_in_active_code
# - category: production_blocker, legacy_test, or historical_doc
# - path_glob: repository-relative glob for the finding path
# - classification: degraded_fallback, legacy_test, historical_doc, or intentional_live_exception
# - owner: accountable person/team/workstream
# - rationale: why this exception is safer than immediate migration
# - expires: ISO date YYYY-MM-DD
# Optional:
# - line: exact line number for a single-line waiver
exceptions:
  - rule_id: retired_role_in_active_code
    category: production_blocker
    path_glob: src/api/routes/chat_pipeline/routing_decision.py
    line: 24
    classification: intentional_live_exception
    owner: stack-change-governance
    rationale: legacy external ingress label is normalized to architect_general before runtime lookup
    expires: "2026-07-31"
  - rule_id: retired_role_in_active_code
    category: production_blocker
    path_glob: src/config/stack_templates.py
    line: 43
    classification: intentional_live_exception
    owner: stack-change-governance
    rationale: retired-role denylist prevents architect_coding and thinking_reasoning from becoming deployable stack-template roles
    expires: "2026-07-31"
  - rule_id: retired_role_in_tests
    category: legacy_test
    path_glob: scripts/memory/*.py
    classification: legacy_test
    owner: stack-change-governance
    rationale: memory seed fixtures carry retired-role labels for replay/backcompat only
    expires: "2026-07-31"
