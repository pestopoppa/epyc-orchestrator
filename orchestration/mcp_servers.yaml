# MCP Server Configuration
# Maps symbolic server identifiers (used in script JSON "mcp_server" fields)
# to actual launch commands. Decouples script definitions from package names.

servers:
  "@anthropic/fetch":
    command: "npx"
    args: ["-y", "@anthropic/mcp-server-fetch"]
    timeout: 30

  "@community/arxiv-search":
    command: "npx"
    args: ["-y", "@anthropic/mcp-server-fetch"]  # fallback until dedicated arxiv server exists
    timeout: 30

  "orchestrator":
    # The project venv carries the pinned fastmcp>=3, which refuses undeclared tool
    # arguments (HS-4 P0-MCP-a). A bare "python3" resolves to whatever is on PATH.
    command: "/mnt/raid0/llm/epyc-orchestrator/.venv/bin/python"
    args: ["/mnt/raid0/llm/epyc-orchestrator/src/mcp_server.py"]
    env:
      PYTHONPATH: "/mnt/raid0/llm/epyc-orchestrator"
    timeout: 10
