classification_rules:
  unit: "top_level_progress_section"
  precedence:
    - research_intake_deep_dive
    - code_change_implementation
    - benchmark_eval_measurement
    - debug_root_cause
    - ops_deploy_process
    - governance_docs_handoff
    - planning_architecture_review
  note: >-
    Sections can contain multiple activities. The primary class is the first
    matched class in precedence order; W2 task_record capture must replace this
    proxy with explicit class labels.

