traffic_classes:
  - id: "interactive"
    display_name: "Interactive Operator Work"
    expected_volume_share:
      estimate: 0.55
      range: [0.45, 0.70]
      evidence: "2026-06-11 tally: frontdoor/operator work is the majority of non-forced-eval traffic, but exact shares await task_record capture."
    latency_slo:
      p50_s: 15
      p95_s: 60
      queue_budget_ms_default: 5000
    throughput_slo:
      objective: "preserve perceived responsiveness; throughput is secondary"
      metric: "median accepted operator tasks per hour"
    serving_class: "foreground_exclusive_or_low_contention"
    contention_priority: "foreground"
    consumers:
      routing: "higher cost weight; prefer reliable roles and bounded queueing"
      placement: "avoid background eval contention unless explicitly allowed by matrix"
      autopilot: "not an optimization workload"

  - id: "eval_batch"
    display_name: "Evaluation Batch"
    expected_volume_share:
      estimate: 0.23
      range: [0.20, 0.30]
      evidence: "Seed from findings-04 §D: forced-eval traffic around 23%; runtime progress JSONL remains harness-dominated."
    latency_slo:
      p50_s: null
      p95_s: null
      queue_budget_ms_default: 90000
    throughput_slo:
      objective: "maximize valid questions/hour under measurement protocol"
      metric: "per-question ledger goodput by suite and traffic class"
    serving_class: "continuous_batch_or_idle_quarters"
    contention_priority: "background"
    consumers:
      routing: "lower latency weight; require metric-direction and baseline era"
      placement: "eligible for batch-friendly instance sets"
      autopilot: "self-label eval_tower and seeding traffic as eval_batch"

  - id: "campaign"
