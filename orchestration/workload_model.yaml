traffic_class_tagging:
  explicit_field: "workload_class"
  default: "interactive"
  inference_rules:
    - class: "eval_batch"
      when: "eval_batch_id/concurrency_batch_id present, or source is eval_tower/seeding/benchmark"
    - class: "campaign"
      when: "campaign_id present, or source is nightshift/kbrag/research_campaign/autopilot_campaign"
    - class: "interactive"
      when: "default for operator-facing /chat traffic"

downstream_contracts:
  passive_capture_w2:
    required_event: "task_record"
    required_fields:
      - "task_id"
      - "class"
      - "prompt_ref"
      - "route_taken"
      - "wall_s"
      - "tokens"
      - "outcome"
      - "source"
      - "privacy_class"
    class_source: "one-keystroke explicit label with heuristic default"
  real_suite_w3:
    first_target_items: 50
    sampling: "stratified by task_classes, not pooled by raw volume"
    judge_policy: "rubric/llm_judge items are promotion/audit only"
  routing_w4:
    report_by_class: true
    do_not_pool_classes: true
