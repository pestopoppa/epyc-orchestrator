# Operator-declared acceptances of known stack-prior gaps.
#
# WHY THIS FILE EXISTS
# The stack-change gate had exactly one severity. A gap the operator had
# consciously accepted looked identical to an unsafe launch, so the only way to
# start the stack was ORCHESTRATOR_SKIP_STACK_CHANGE_GATE=1 — which disables the
# WHOLE gate, including the source-hash, launch-parity and retired-role checks
# that are genuinely load-bearing. Between 2026-07-31 and 2026-08-01 the stack
# was started that way four times in a row. A bypass used four times running is
# not an escape hatch, it is the new default.
#
# A declaration here downgrades ONE named gap on ONE named role to a VISIBLE
# warning that survives strict mode. It does not silence anything: the gap is
# printed on every gate run with its owner and expiry.
#
# RULES
# - Match is EXACT on (role, gap). No wildcards, no "all gaps for this role",
#   no "all gaps of this type" — a declaration filed for a missing quality prior
#   must never also swallow a missing live server binding.
# - `expires` is REQUIRED. An accepted gap that never expires is a deleted check.
# - An EXPIRED declaration is an ERROR, and the gap it covered goes back to
#   blocking. Renew with fresh evidence or close the gap; do not extend by habit.
# - A declaration that matches no current gap is an ERROR (stale waiver = drift).
#
# Required fields per entry:
# - role:     stack-prior role key, exactly as it appears in
#             orchestration/derived/stack_priors.yaml
# - gap:      the gap string, exactly as compiled (see known_gaps /
#             known_global_gaps in that artifact)
# - reason:   what is known, what instrument produced it, and what is missing
# - owner:    accountable person/team
# - declared: ISO date the acceptance was made
# - expires:  ISO date it stops being accepted
#
# Verify with:
#   uv run python scripts/validate/stack_change_guard.py --strict
#   uv run python scripts/registry/stack_change_pipeline.py check
# ---------------------------------------------------------------------------
# 2026-08-03: the three "Missing overall quality prior" declarations
# (architect_general, coder_escalation, qwen36_27b_mtp_q8_local) were REMOVED
# because the gap they waived no longer exists, and this file's own rule is that
# a declaration matching no current gap is an ERROR.
#
# They were filed 2026-08-01 on sound reasoning: the Qwen3.6-27B carried ratified
# SWE-bench Verified evidence (23/40, 57.5%) but no canonical judge-suite run, so
# quality_score was deliberately left null "rather than laundered from a different
# instrument onto a scale it was not measured on".
#
# What changed is the REPRESENTATION, not the evidence. Quality is no longer a
# single scalar that a domain score has to be promoted into; it compiles as
# quality_by_axis + quality_for_role, each keyed BY BENCHMARK and carrying its own
# basis and rankability. Those roles now resolve a prior of 0.8597 with basis
# "role-relevant axis reasoning via mmlu_pro" — provenance recorded, not laundered.
# The gap check now asks "is there evidence?" rather than "is there a scalar?",
# which is precisely the pressure that used to manufacture fake numbers.
#
# The waivers' closing action — run the canonical 79-question judge suite on the
# 27B — is NOT satisfied by this and remains open work, tracked as a task rather
# than as a waiver for a gap that no longer fires.
# ---------------------------------------------------------------------------
accepted_gaps: []
