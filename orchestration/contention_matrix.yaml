# Stale-detection: orchestrator computes a topology fingerprint from
# scripts/server/stack_numa.py NUMA_CONFIG and compares against `topology_hash`
# here. Mismatch means roles or NUMA bindings changed since this matrix was
# measured; refresh via `scripts/server/contention_matrix.py` (Phase F).

