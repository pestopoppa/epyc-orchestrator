# ── N-way contention matrix (Package J — corrected quarter-level model, 2026-05-26) ──
# Cross-role concurrency is mutually-disjoint cpusets. The AUTHORITATIVE layer is
# quarter-level: each role placed on a disjoint quarter via the WP-2 PlacementPolicy.
# Large models that cannot run on a 24-core quarter co-run only via their full/half
# instance: ingest_long_context = half (0-47); architect_general = whole-machine full
# (0-95) and has no half/quarter, so it is strictly SOLO (never in a feasible set).
# Measured with --safe-sampling (temp>0 + repeat_penalty) after the gemma4 PEG-parser
# crash fix (ik_llama.cpp d84755dc). ratio = parallel_aggregate_tps / seq_aggregate_tps;
# >=1.0 allow, 0.85-1.0 borderline-allow(foreground), <0.85 block.
# topology_hash df373c79cc4af06f. Artifacts: data/contention_matrix/
# bulk-2026-05-26-j4b-feasible-{v2 (size>=3), pairs (size 2)} + -j4a-feasible-v2.
#
# RUNTIME POLICY (consumed by src/scheduling/contention.py nway_policy + the gate, J4c):
#   * all-light-quarter sets -> allow. Every role BW-light + on its own quarter
#     (frontdoor, vision_escalation, worker_general, worker_vision). Anchored by the
#     measured 4-way 1.605x + within-role same_role 1.88-2.86x. Mixed multi-instance
#     light sets (e.g. 2x frontdoor + worker_general + worker_vision) fall in this
#     class and need no separate measurement — contention is per-NUMA-node BW, ~role
#     -identity-independent for light models.
#   * any set containing a HEAVY instance (ingest_long_context / architect_general)
#     MUST consult the measured entries below; do NOT infer from pairwise. The N-way gate is
#     a DEFENSIVE mechanism — an all-pairwise-allowed set could in principle be aggregate-negative.
#     History: {frontdoor, ingest, vision} once read 0.847 BLOCK and was cited as the proof of
#     pairwise!=N-way — but that was a BAD-AFFINITY ARTIFACT; on certified disjoint quarters it is
#     1.731 ALLOW (see n_way entry below). As of the 2026-05-26 certified re-bench there is NO
#     measured N-way block; the gate queues any future measured-block set if one is ever found.
nway_default_floor: 0.85
nway_light_roles: ["frontdoor", "vision_escalation", "worker_general", "worker_vision"]
nway_heavy_roles: ["ingest_long_context", "architect_general"]

