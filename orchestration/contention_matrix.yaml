# Same-role pairs (where role decodes against itself across instances).
# Used by the gate when a second request for the SAME role arrives.
same_role:
  - role: "frontdoor"
    verdict: "allow"
    note: "J5 (WP-6, 2026-05-26): all 8 disjoint instance pairs allow (1.37-1.67x); quartering wins. Quarters correctly -t 48."
    instance_pairs:   # J5 measured, --safe-sampling, topology df373c79cc4af06f
      - {a: full, b: q3, ratio: 1.367, cv: 0.059, verdict: allow}
      - {a: q0,   b: q2, ratio: 1.415, cv: 0.079, verdict: allow}
      - {a: full, b: q2, ratio: 1.454, cv: 0.016, verdict: allow}
      - {a: q0,   b: q1, ratio: 1.507, cv: 0.070, verdict: allow}
      - {a: q0,   b: q3, ratio: 1.553, cv: 0.054, verdict: allow}
      - {a: q1,   b: q2, ratio: 1.616, cv: 0.029, verdict: allow}
      - {a: q2,   b: q3, ratio: 1.649, cv: 0.043, verdict: allow}
      - {a: q1,   b: q3, ratio: 1.670, cv: 0.038, verdict: allow}

  - role: "ingest_long_context"
    verdict: "allow"
    note: "4-quarters @ 2.86× — strongest signal in matrix. NOTE: ingest is NON_QUARTERABLE for cross-role (80B on 24 cores ~0.1 t/s, over-threaded); this same-role 2.86x predates the -t finding and may itself be confounded — runs full/half in practice."

  - role: "worker_general"
    verdict: "borderline"   # CLEAN -t48 re-bench 2026-05-26: 4/6 borderline, 2/6 block, all net-positive
    samples: 3
    note: >-
      J5 -t48 RE-BENCH (2026-05-26, alone on host, --safe-sampling, samples=3): mean ratio 0.879
      across the 6 disjoint quarter pairs → role verdict BORDERLINE. This SUPERSEDES the confounded
      -t96 first pass (0.58-0.84x BLOCK). The over-threading was a real *contributing* factor
      (every pair improved +0.05 to +0.26 once quarters launched -t 48 via launcher fix da1aed6),
      but a residual cross-node DRAM-BW ceiling keeps 2 pairs sub-floor — consistent with BW-bound
      CPU decode (never super-linear; "allow" ratio>=1.0 is structurally unreachable here, so
      borderline IS the realistic green light). Per-pair -t48: q0+q1 0.946, q0+q3 0.938, q1+q2 0.920,
      q2+q3 0.855 (borderline) | q0+q2 0.844, q1+q3 0.772 (block; both cross-NUMA-node, worst contention).
      ALL 6 sit well above the 0.5 co-run-vs-serialize break-even (1.54-1.89x aggregate), so concurrent
      quartering is net-positive on every pair — the runtime gate now ALLOWs same-role co-run instead of
      serializing. Cross-role n_way (1.58-1.81x allow) was benched while these quarters were -t96-over-threaded,
      so it is conservative and remains valid (a -t48 cross-role re-bench would only improve it).
      FOLLOW-UPS: (1) flip takes effect on next API restart (matrix is load-once cached) — J6/WP-7 will apply it;
      (2) placement_policy=burst_prefer_quarters for worker_general is the matching NUMA_CONFIG change (WP-7);
      (3) a node-aware burst that avoids the q0+q2/q1+q3 cross-node pairs would lift every co-run >=0.85.
    instance_pairs:   # documentation only — loader reads role/verdict/note (extra keys ignored)
      - {a: q0, b: q1, ratio: 0.946, cv: 0.104, verdict: borderline}
      - {a: q0, b: q3, ratio: 0.938, cv: 0.050, verdict: borderline}
      - {a: q1, b: q2, ratio: 0.920, cv: 0.077, verdict: borderline}
      - {a: q2, b: q3, ratio: 0.855, cv: 0.065, verdict: borderline}
      - {a: q0, b: q2, ratio: 0.844, cv: 0.091, verdict: block}
      - {a: q1, b: q3, ratio: 0.772, cv: 0.169, verdict: block}

  - role: "vision_escalation"
    verdict: "block"
    note: >-
      J5 (2026-05-26) confirms the same-role anomaly at instance-pair granularity: all 8 disjoint
      pairs BLOCK (0.40-0.46x). Two compounding causes: (1) launcher over-threading (-t 96 on 24-core
      quarters; fixed da1aed6, re-bench at -t 48 pending) and (2) the prior --mmproj/qwen3vlmoe
      suspicion. Gate must serialize vision_escalation (don't quarter) until a -t 48 re-bench.

  - role: "architect_general"
    verdict: "n/a"
    note: "single-instance only (122B Q4 too large to quarter)"

  - role: "worker_vision"
    verdict: "n/a"
    note: "single-instance; too small to benefit from quartering (Phase 0.5 bench)"

