    note: "all same-role pairs > floor; quartering wins for aggregate"

  - role: "ingest_long_context"
    verdict: "allow"
    note: "4-quarters @ 2.86× — strongest signal in matrix"

  - role: "worker_general"
    verdict: "allow"
    note: "gemma4 MTP is BW-light; assumed quarter-safe (not directly measured 4-way)"

  - role: "vision_escalation"
    verdict: "block"
    note: "ANOMALY: 4-quarters @ 0.29× despite disjoint cpusets; suspect --mmproj or qwen3vlmoe; gate must serialize until investigated"

