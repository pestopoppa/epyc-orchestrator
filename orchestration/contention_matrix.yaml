# Cross-role decode contention matrix.
#
# Generated 2026-05-24 from the v1+v2-partial+v3 benches captured during the
# frontdoor throughput investigation. Raw artifacts:
#   /workspace/tmp/contention_matrix_results.txt    (v1)
#   /workspace/tmp/contention_matrix_v2_results.txt (v2 partial)
#   /workspace/tmp/contention_matrix_v3_results.txt (v3)
#
# Semantics (matches src/scheduling/contention.py):
#   ratio = parallel_aggregate_tps / sequential_aggregate_tps
#   ratio >= 1.0  -> "allow"     — concurrent execution improves aggregate
#   0.85 <= r<1   -> "borderline" — allow foreground; block background by default
#   ratio < 0.85  -> "block"     — block or queue, especially for background traffic
#   missing pair  -> "unknown"   — block for background; foreground only if waiting violates SLO
#
# Stale-detection: orchestrator computes a topology fingerprint from
# scripts/server/stack_numa.py NUMA_CONFIG and compares against `topology_hash`
# here. Mismatch means roles or NUMA bindings changed since this matrix was
# measured; refresh via `scripts/server/contention_matrix.py` (Phase F).

