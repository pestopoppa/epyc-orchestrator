# Authored effect contracts for registry tools reachable by stored/replayed calls (UFH-TE-4).
# classes: read-only | mutating | external_side_effect | irreversible | unknown
# Rule: a class is recorded only where the registry declares it (side_effects) or the description states it
# outright. Everything else is `unknown`, which BLOCKS reuse. No inference from names or permissions.
# Stored-call set = every tool in orchestration/tool_registry.yaml (the TOOL/CALL surface); none is excluded.
