# Public (vendor-reported / leaderboard) benchmark results, keyed by model.
#
# WHY THIS FILE EXISTS
# --------------------
# The stack needs to RANK models against each other so routing can prefer the
# right model per axis. Running our own suite for that failed: the canonical
# 79-question judge suite is 74% saturated (both arms scored a perfect 3 on
# 50/68 questions) and could not separate architect_general from frontdoor
# (+0.5pp, exact sign test p=0.267). Published benchmarks separate them
# cleanly on every axis. See artifacts under
# epyc-inference-research/data/judge-suite-headtohead-20260802/.
#
# WHAT THESE NUMBERS ARE, AND ARE NOT
# -----------------------------------
# They are THIRD-PARTY CLAIMS, not our measurements. Per MEASUREMENT.md claim
# grammar they may never be stated as measurements of THIS deployment. Two
# systematic gaps, both recorded per-entry:
#
#   precision : vendors report bf16; we serve Q8_0 or Q4_K_M.
#   mode      : Qwen3.6 cards state thinking mode by default; we serve
#               enable_thinking=false.
#
# Both biases apply to every model alike, so the RANKING is usable and the
# LEVELS are not. That is the only claim this file supports.
#
# CALIBRATION AGAINST OUR OWN STACK
# ---------------------------------
# SWE-bench Verified is the one axis where a vendor number and a locally
# ratified number exist for the same model:
#   Qwen3.6-27B  vendor 0.772   local 0.575 (23/40)   ratio 0.745
# So this deployment realises ~75% of a published figure. That ratio is
# evidence from ONE axis on ONE model — it is not a licence to scale every
# number by 0.745.
#
# WHAT 0.745 IS NOT: a quantization penalty. It CONFOUNDS four differences at
# once and cannot be attributed to any one of them:
#   1. Q8_0            vs bf16
#   2. thinking=false  vs thinking-on
#   3. our 40-question subset vs the full 500-instance SWE-bench Verified
#   4. our scaffold    vs the vendor's harness
# Reading it as "Q8_0 costs 25%" would be wrong; (2) and (3) are individually
# capable of moving SWE-bench by more than the whole gap.
#
# FUTURE IDEA — NOT SCHEDULED, NOT COSTED (2026-08-02, operator)
# --------------------------------------------------------------
# If the gap ever proves to be substantially (1), serving Qwen3.6-27B at bf16
# instead of Q8_0 becomes interesting: it is the smallest model on the GPU and
# the only one where full precision could plausibly fit. Isolating (1) needs a
# controlled A/B — same 40 questions, same scaffold, thinking held constant,
# only precision varied — which nobody has run. VRAM makes this non-trivial:
# 27B at bf16 is ~54 GB of weights against a 64 GB MI210 that is presently at
# 99.6% with four resident processes. Recorded so the ratio is not silently
# re-derived later as if it were a clean quantization measurement.
#
# COMPARABILITY RULE — THE POINT OF THE WHOLE FILE
# ------------------------------------------------
# Entries are keyed by BENCHMARK, never by an abstract axis, because two
# benchmarks under one axis name are not rival estimates of one quantity:
#   * aime26 != aime25             (different test sets; Next-80B reports 25)
#   * ruler_1m != longbench_v2 != mrcr_v2_128k   (three long-context
#     instruments; comparing them is exactly the mixed-scale defect that put a
#     27-question long-context score into `quality_overall` as if it described
#     the whole model)
# Two values are comparable IFF they share a benchmark key. `axes:` below is a
# VIEW for role relevance and must never be used as a comparison unit.

schema_version: 1
retrieved: 2026-08-02
retrieved_by: session 26b5f442 (operator-directed)

# benchmark key -> which capability axis it is evidence about. A view only.
axes:
  mmlu_pro: reasoning
  gpqa_diamond: science
  aime26: math
  aime25: math
  hmmt25: math
  livecodebench_v6: coding
  aider_polyglot: coding
  codeforces_elo: coding
  swe_bench_verified: agentic_coding
  terminal_bench_2: agentic_terminal
  tool_compliance_local: tool_use
  bfcl_v3: tool_use
  bfcl_v4: tool_use
  ifeval: instruction_following
  mmmu: vision_language
  mmmu_pro: vision_language
  mathvision: vision_language
  ruler_1m: long_context
  longbench_v2: long_context
  aa_lcr: long_context
  mrcr_v2_128k: long_context

# Benchmarks reported by EVERY text model below — the comparable core. A
# ranking that uses only these keys has no coverage holes.
universal_keys:
  - mmlu_pro
  - gpqa_diamond
  - livecodebench_v6

# capability tag (registry roles.<role>.candidate_roles) -> axes that matter for
# it, most specific first. Roles are NOT listed here: a role's capabilities are
# already declared in the registry, and restating them would be one more table
# to drift.
#
# A preferred axis is only USED when it can actually rank — i.e. at least two
# fleet models report the same benchmark on it. Otherwise the resolver falls
# back to the universal aggregate and records that it did.
capability_axes:
  ingest: [long_context, reasoning]
  summarization: [long_context, reasoning]
  architect: [reasoning, science, agentic_coding]
  architect_critic: [reasoning, science]
  architect_general: [reasoning, science, agentic_coding]
  critic: [reasoning, science]
  reasoning: [reasoning, science]
  thinking: [reasoning, science]
  coder: [coding, agentic_coding]
  coder_escalation: [agentic_coding, coding]
  math: [math, reasoning]
  worker: [tool_use, instruction_following, reasoning]
  draft: [reasoning]
  frontdoor: [reasoning, instruction_following]
  general: [reasoning]
  vision: [vision_language]
  agentic_vision: [vision_language]

# CROSS-MODEL RANKABILITY, measured from the data below rather than asserted.
#
# tool_use: FIXED 2026-08-02. It was unrankable (bfcl_v3 on one model, bfcl_v4
# on another) until `tool_compliance_local` was measured across all six models
# under one judge. That axis now ranks, and it discriminates far better than
# any suite we own: 70.4-85.2%, versus 74% of judge-suite questions sitting at
# a perfect ceiling.
#
# long_context: STILL unrankable. Each vendor publishes a different suite
# (ruler_1m / longbench_v2 / aa_lcr / mrcr_v2_128k, one model each), so the
# values are used for the OWNING role's fitness but carry rankable=false and
# must never order models. Note this is not merely a missing run: a local
# needle-retrieval attempt could not discriminate either (every arm 38/39,
# including f16), which is why the KV study rebuilt around KL divergence.
# Ranking this axis needs a better instrument, not just a longer slot.

models:
  qwen3.6-27b-mtp-q8_0:
    display_name: Qwen3.6-27B
    roles: [architect_general, coder_escalation]
    served_precision: Q8_0
    provenance: vendor_reported
    reported_precision: bf16
    reported_mode: thinking
    source_url: https://huggingface.co/Qwen/Qwen3.6-27B
    benchmarks:
      mmlu_pro: 0.862
      gpqa_diamond: 0.878
      aime26: 0.941
      hmmt25: 0.938
      livecodebench_v6: 0.839
      swe_bench_verified: 0.772
      terminal_bench_2: 0.593
      mmmu: 0.829
      mmmu_pro: 0.758
    # Measured on THIS stack 2026-08-02, not a vendor claim: the canonical
    # tool_compliance suite (9 questions, 0-3 rubric) scored by
    # architect_critic across all six models under one judge, one budget.
    # Weaker instrument than an execution-verified benchmark like BFCL --
    # it is 9 LLM-judged questions -- but it is the only tool_use evidence
    # that covers the whole fleet, and it DISCRIMINATES: 70.4-85.2%, a
    # 14.8pp spread, versus the 74%-ceiling saturation of the other suites.
    local_benchmarks:
      tool_compliance_local: 0.741
    absent_from_card: [ifeval, bfcl_v3, bfcl_v4, ruler_1m, longbench_v2]
    local_corroboration:
