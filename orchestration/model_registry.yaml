# =============================================================================
# Model Registry Configuration
# =============================================================================
#
# Path Configuration:
#   All paths are relative to the base paths defined here or can be overridden
#   via environment variables (see .env.example):
#     - ORCHESTRATOR_PATHS_LLM_ROOT (default: /mnt/raid0/llm)
#     - ORCHESTRATOR_PATHS_MODEL_BASE (default: ${LLM_ROOT}/lmstudio/models)
#     - ORCHESTRATOR_PATHS_LLAMA_CPP_BIN (default: ${LLM_ROOT}/llama.cpp/build/bin)
#
# Model Downloads:
#   Models with huggingface_id can be downloaded via:
#     python scripts/setup/download_models.py --tier hot
#
# =============================================================================

runtime_defaults:
  quantization: Q4_K_M
  draft_quantization: Q8_0
  context_length: 8192
  temperature: 0.2
  threads: 96
  numa_policy: interleave=all
  # Base path for models - override with ORCHESTRATOR_PATHS_MODEL_BASE env var
  model_base_path: /mnt/raid0/llm/lmstudio/models
  binaries:
    # Binary path - override with ORCHESTRATOR_PATHS_LLAMA_CPP_BIN env var
    base_dir: /mnt/raid0/llm/llama.cpp/build/bin
    completion: llama-completion
    speculative: llama-speculative
    lookup: llama-lookup
    cli: llama-cli
    server: llama-server
    mtmd: llama-mtmd-cli
    qwen2vl: llama-qwen2vl-cli
    bench: llama-bench
    embedding: llama-embedding
    perplexity: llama-perplexity
    quantize: llama-quantize
  server_defaults:
    port: 8080
    context_length: 65536
    startup_timeout: 600
    request_timeout: 600  # Increased from 300 - architect_general needs ~300s on hard questions
    parallel_slots: 4
    flash_attention: true
    ubatch_size: 8192
    # KV cache quantization (updated 2026-03-28):
    # CRITICAL: V=q4_0 causes 71% prefill regression on pure-attention models.
    # q4_0 K / f16 V = quality-neutral (PPL +0.017 with Hadamard), zero prefill cost, 37% KV savings.
    # q4_0 / q4_0 = max compression but 71% prefill hit. OK for hybrid SSM models only.
    # Per-role overrides in orchestrator_stack.py _KV_QUANT_CONFIGS
    kv_cache_type_k: q4_0
    kv_cache_type_v: f16
  # Per-model compression-tolerance for agent files (handoffs/active/agent-file-prose-compression.md).
  # `none` = model has not been probed; production roles MUST upgrade to `mild` or higher.
  # `mild` ~20% reduction, `medium` ~40%, `aggressive` ~60% (per .claude/skills/agent-file-compress/SKILL.md).
  # Override per-role inside `roles.<role>.agent_file_compression_operating_point` after running
  # `tests/compliance/agent_file/runner.py` against the candidate model (Phase 3 of the handoff).
  agent_file_compression_operating_point: none

  corpus_retrieval:
    enabled: true        # A/B validated: +8.7pp/32B, +15.6pp/480B. Per-role via lookup flag.
    index_path: /mnt/raid0/llm/cache/corpus/v3_sharded  # Sharded SQLite v3 (in-progress build, falls back gracefully). mvp_index kept as backup.
    max_snippets: 3
    max_chars: 3000
    # rag_enabled: ABANDONED. Prompt-level RAG hurts quality on 7B (-0.96) AND 32B (-1.38).
  prefix_cache:
    enabled: true
    prefix_length: 4096  # Was 256. Role prompts are 1000-5000 tokens; need longer prefix for cache hits.
    canonicalize: true
    cache_dir: /mnt/raid0/llm/cache/prefixes
  context_limits:
    default: 65536
    llama2: 4096
    llama3: 8192
    llama3_instruct: 131072
    qwen2: 131072
    qwen3: 131072
    deepseek_r1: 65536
    gemma3: 131072
  llm:
    # Conservative nested-call rollout map (feature-gated by depth_model_overrides).
    # depth 0 never overrides; depth 1+ may route to cheaper worker roles only.
    depth_role_overrides: "1:worker_general,2:worker_math"
    depth_override_max_depth: 3
  timeouts:
    # Single source of truth for ALL timeouts in the system
    default: 600  # Fallback for any unspecified timeout

    # Per-role inference timeouts (seconds) — differentiated by model size/speed
    # Workers (30B-A3B @ 39 t/s, 1.5B @ fast) get short timeouts so circuit breaker
    # opens quickly; architects (122B/480B) keep 600s for complex reasoning.
    roles:
      worker_explore: 60       # 30B-A3B @ 39 t/s — expected <5s, 60s = 12x headroom
      worker_math: 60
      worker_vision: 60
      worker_summarize: 120    # Qwen3.6-35B-A3B Q8 (post-2026-05-06 swap; same model as frontdoor); longer outputs justify higher timeout
      worker_general: 60
      worker_coder: 30         # semantic alias for fast coding worker (port 8102)
      worker_fast: 30          # 1.5B — expected <2s, 30s = 15x headroom
      frontdoor: 180           # 30B MoE @ 18 t/s — raised from 90 to accommodate pipeline stages
      coder_escalation: 120    # 32B Q4KM @ 10.8 t/s — 500 tok ~46s. 120s = 2.6x headroom
      vision_escalation: 120   # 30B MoE VL, multimodal processing
      ingest_long_context: 300 # 80B SSM, long document ingestion
      architect_general: 600   # 122B MoE hybrid @ 12.19 t/s (1× canonical, Probe B 2026-05-04), complex multi-step reasoning
      # architect_coding REMOVED 2026-05-06 — role eliminated; hard coding routes to coder_escalation

    # Server/connection timeouts
    server:
      request: 600
      connect: 5
      health_check: 5
      stack_startup: 300  # Wait for orchestrator stack

    # Service timeouts
    services:
      ocr_single_page: 120
      ocr_pdf: 600
      vision_inference: 120
      vision_figure: 60
      gradio_client: 300
      ffmpeg_version: 5
      ffmpeg_probe: 30
      ffmpeg_extract: 600
      exiftool: 30

    # Worker pool timeouts
    pools:
      warm_keepalive: 300  # 5 minutes warm pool timeout
      client_total: 300  # HTTP client total timeout
      client_connect: 10  # HTTP client connect timeout

    # Benchmark/optimization timeouts
    benchmark:
      test_execution: 300
      optuna_trial: 300
      seeding_default: 600
      # Model-size based timeouts for full_optimization_benchmark.sh
      timeout_small: 120  # <2B models
      timeout_medium: 180  # 2B-14B models
      timeout_large: 300  # 14B-72B models
      timeout_huge: 600  # 72B-100B models
      timeout_giant: 1200  # >100B models (235B, 480B)

    # REPL environment timeouts
    repl:
      session: 600  # REPL session timeout (document processing can be slow)
      tool_execution: 30  # Per-tool execution limit
      shell_command: 30  # External shell command timeout
      restricted_executor: 120  # Sandboxed code execution

    # Gate-specific timeouts (quality gates)
    gates:
      format: 30  # Code formatting check
      lint: 60  # Linting (ruff, etc.)
      typecheck: 120  # Type checking (mypy, pyright)
      unit: 180  # Unit test execution

    # Tool-specific timeouts
    tools:
      web_fetch: 30  # HTTP fetch for external URLs
      lint: 60  # Code linting
      base_default: 60  # Default tool timeout
      formalizer: 60  # Input formalization
      gate_runner: 60  # Gate execution (default per-gate)

    # External service timeouts
    external:
      mcp_client: 30  # MCP server communication
      review_service: 15  # Proactive review checks

    # Health check timeouts
    health:
      server_startup: 120  # Wait for server to become healthy
      quick_check: 10  # Fast health probe
      vision_server: 120  # Vision model startup (larger)
      worker_server: 90  # Worker model startup

    # Script/CLI timeouts
    scripts:
      executor_default: 180  # Default script execution
      onboard_health: 60  # Model onboarding health check
      temperature_opt: 180  # Temperature optimization trial
      orchestrator_phase: 3600  # Full benchmark phase

    # Backend protocol defaults
    backends:
      inference_default: 120  # Default inference request timeout
      document_page: 120  # Per-page document processing
  paged_attention:
    description: "CPU paged attention for memory-bound large models (70B+)"
    enabled_threshold_gb: 39  # Models >= 39GB benefit from paged attention
    default_block_size: 64    # Optimal for 70B+ models (+76% generation speedup)
    env_vars:
      LLAMA_PAGED_ATTN: "${block_size}"
      LLAMA_PAGED_ATTN_MAX_BLOCKS: "${max_blocks}"  # Optional memory reduction
    benefits:
      speedup: "+76% generation speedup on 70B+ models via block prefetching"
      memory_savings: "Up to 80% KV cache reduction with max_blocks"
    notes: "PR #18747 submitted upstream. Cherry-picked to production-consolidated."
  repl_memory:
    description: "MemRL-inspired episodic memory for learned orchestration"
    enabled: true
    database:
      # FAISS backend (default): stores episodic.db + embeddings.faiss + id_map.npy
      # NumPy backend (fallback): stores episodic.db + embeddings.npy
      path: /mnt/raid0/llm/epyc-orchestrator/orchestration/repl_memory/sessions
      use_faiss: true  # O(log n) search; set to false for O(n) NumPy fallback
    embedding:
      # BGE-large-en-v1.5: Purpose-built for embeddings, 1024 dims, better MTEB scores
      # Parallel fan-out to 6 instances (ports 8090-8095) for redundancy
      model_path: /mnt/raid0/llm/models/bge-large-en-v1.5-f16.gguf
      dim: 1024
      threads: 8
      fallback_enabled: true
      # Parallel embedding servers (2026-02-05): 6 instances for redundancy
      server_urls:
        - "http://127.0.0.1:8090"
        - "http://127.0.0.1:8091"
        - "http://127.0.0.1:8092"
        - "http://127.0.0.1:8093"
        - "http://127.0.0.1:8094"
        - "http://127.0.0.1:8095"
      server_url: "http://127.0.0.1:8090"  # Primary (for single-server fallback)
      use_server: true  # Try HTTP server first (2-5ms vs 50-200ms subprocess)
      pooling: cls  # BGE uses CLS token pooling
    retrieval:
      semantic_k: 20
      min_similarity: 0.3
      min_q_value: 0.3
      q_weight: 0.7
      top_n: 5
      confidence_threshold: 0.6
    scoring:
      learning_rate: 0.1
      success_reward: 1.0
      failure_reward: 0.0  # xRouter-style: incorrect = zero reward (was -0.5)
      partial_reward: 0.3
      cost_penalty_lambda: 0.15  # Cost weight for correctness-gated penalty
      min_interval_seconds: 300
      batch_size: 50
    persistence:
      # Write-behind optimization (2026-01-27): async flush every 10s
      flush_interval: 10.0  # Seconds between FAISS index flushes
      sync_on_shutdown: true  # Always flush on SIGTERM/close()
    logging:
      progress_dir: /mnt/raid0/llm/epyc-orchestrator/logs/progress
      buffer_size: 10
    cold_start:
      min_samples: 3
      fallback_to_rules: true
      bootstrap_days: 30
    claude_as_judge:
      enabled: false
      model_path: null
      judge_binary: null
    # Graphiti-inspired graph enhancements (2026-01-27)
    failure_graph:
      enabled: true
      description: "Kuzu graph for failure pattern tracking (anti-memory)"
      db_path: /mnt/raid0/llm/epyc-orchestrator/orchestration/repl_memory/kuzu_db
      # Scoring: actions linked to unmitigated failures get penalty
      penalty_weight: 0.3  # score *= (1 - penalty_weight * failure_risk)
    hypothesis_graph:
      enabled: true
      description: "Kuzu graph for hypothesis confidence tracking"
      db_path: /mnt/raid0/llm/epyc-orchestrator/orchestration/repl_memory/kuzu_db
      # Confidence update: asymptotic toward 1.0 on success, 0.0 on failure
      confidence_delta: 0.1
      low_confidence_threshold: 0.2  # Warn when confidence < this
    graph_cache:
      # TTL cache for graph penalty lookups (2026-01-27)
      enabled: true
      ttl_seconds: 60  # Cache entries expire after 60s
      maxsize: 500  # Max cached entries per cache type
  three_stage_summarization:
    description: "Two-stage pipeline (Stage 0 compression DISABLED due to quality regression)"
    enabled: true
    threshold_tokens: 5000         # Minimum tokens to trigger (estimated from chars/4)
    multi_doc_discount: 0.7        # Lower threshold for multi-document tasks
    context_reduction_target: 0.15 # Stage 2 receives ~15% of original context
    # Stage roles inverted 2026-05-06 — better matches each model to its stage's
    # demand profile. Pre-2026-05-06: stage1=frontdoor, stage2=ingest_long_context.
    # Rationale per long_context bench (May 4-6):
    #   - Stage 1 demand: SPEED at full long context (every token costs).
    #     Qwen3-Next-80B's SSM-hybrid linear attention scales O(n) per token,
    #     beating Qwen3.6-35B-A3B's pure-attention scaling at extreme contexts.
    #     Bench: ingest 14.4-20.8 t/s @ 12K vs frontdoor 6.5-16.6 t/s.
    #   - Stage 2 demand: QUALITY on reduced context (~15% of original ≈ 7-8K).
    #     Qwen3.6-35B-A3B Q8 scored 27/27 (100%) on long_context suite vs
    #     Qwen3-Next-80B's 25/27 (93%). At 7-8K context, frontdoor's lower
    #     long-context throughput is acceptable for the quality-review pass.
    # Architectural diversity preserved: SSM-hybrid (stage 1) + MoE-attention
    # (stage 2). Three_stage_summarization design intent unchanged.
    stage1_role: ingest_long_context  # SSM-hybrid linear attention; fast draft on full context
    stage2_role: frontdoor             # Higher quality review on reduced context (~15%)
    compression:  # Stage 0: LLMLingua-2 extractive compression
      enabled: false               # DISABLED - causes quality regression
      model: microsoft/llmlingua-2-bert-base-multilingual-cased-meetingbank
      device: cpu
      min_chars: 30000
      target_ratio: 0.5
      stage1_context_limit: 20000
      cache_model: true
      expected_latency_ms: 50
      quality_regression_notes: |
        DISABLED 2026-01-27: LLMLingua-2 extractive compression causes:
        - Prompt leakage in output
        - Hallucinated citations [1], [2]
        - Typos ("tokenizeize", "cUSTODY")
        - 140s vs 74s (slower, not faster)
        Root cause: Extractive compression produces choppy text that confuses LLM.
        RECOMMENDATION: Wait for Cmprsr (abstractive) weights to become available.
    cache:
      enabled: true
      ttl_hours: 24
      dir: /mnt/raid0/llm/cache/drafts
    expected_speedup:
      10k_tokens: "1.4x"           # Modest speedup at lower sizes
      20k_tokens: "1.5x"
      50k_tokens: "1.6x"           # Prefill savings accumulate
      multi_doc_5x10k: "3.9x"
    notes: |
      Three-stage pipeline: Stage 0 (compress) → Stage 1 (draft) → Stage 2 (review)
      Stage 0 benefit: quality improvement from representative sampling vs truncation.
      Breakeven at ~5K tokens. Below this threshold, overhead dominates.
      Stage 1 captures grep hits during exploration for Stage 2 context.
      Caching enables instant Stage 2 for repeated documents.
  # Backwards compatibility alias
  two_stage_summarization:
    description: "Alias for three_stage_summarization (deprecated)"
    redirect_to: three_stage_summarization
server_mode:
  # Production topology - orchestrator_stack.py launcher
  # Port 8000: Orchestrator API (uvicorn)
  # Ports 8080-8085: Model servers (llama-server)

  # HOT tier - always resident (~40GB total)
  frontdoor:
    # Port: 8070 is the full-mode 1×96t instance (default per orchestrator_stack.py:114
    # PORT_MAP, used by `start --numa-mode full`). Quarter-mode 4×48t lives on
    # numa_ports below. Reconciled 2026-05-09 — was 8080, but no full-mode role
    # ever runs there; consumers (autopilot seeder, status checks) now find the
    # right port whether the stack is launched in full or quarter mode.
    url: http://localhost:8070
    port: 8070
    slots: 2  # -np 2 at launch (launcher: SERIAL_ROLES gate; frontdoor not serial). The "round-robin"
              # comment formerly here referred to NUMA quarter-mode routing on 8080/8180/8280/8380; that
              # is still valid when --numa-mode quarter is used.
    # 2026-05-20: enable_thinking=false is load-bearing for this role.
    # Empirical: raw chat-completions with default thinking-on caused frontdoor
    # to score 7/15 (47%) on a mixed-domain cheap-kill (knowledge/reasoning tasks
    # got stuck in degenerate <think> loops, returning empty content). Adding
    # enable_thinking=false lifted it to 12/15 (80%) — top accuracy in the
    # stack. See handoffs/active/x-mas-text-routing.md § "Stack-simplification
    # probe (2026-05-20)".
    chat_template_kwargs:
      enable_thinking: false
    model_role: qwen36_q8_0
    shared_with: []
    description: Root LM — Qwen3.6-35B-A3B Q8 (quality 93%, May-4 Claude-as-Judge 170/183)
    model: Qwen_Qwen3.6-35B-A3B-Q8_0.gguf
    model_path: /mnt/raid0/llm/models/Qwen_Qwen3.6-35B-A3B-Q8_0.gguf
    # No draft model — pure MoE; spec decode worth investigating but unverified
    kv_quant: {k: q8_0, v: q8_0}  # Qwen trained in bf16; q8_0 KV per HF model card (#20035)
    memory_gb: 37
    tier: hot
    numa_instances: 4  # 4×48t NUMA-quarter instances
    numa_ports: [8080, 8180, 8280, 8380]
    acceleration:
      type: none  # Q8 baseline; revisit moe_expert_reduction after sweep
      lookup: false
      corpus_retrieval: true
    throughput: 24.3  # t/s aggregate target (May-4 baseline; canonical recipe + preflight gate)
    previous_model: Qwen3.5-35B-A3B-UD-Q4_K_M.gguf  # swapped 2026-05-04 (Qwen3.6 Q8: +11pp, +80% t/s)
    benchmark_score: "170/183 (92.9%)"  # Claude-as-Judge May 4 6-suite under canonical
    benchmark_date: 2026-05-04

  coder_escalation:
    # Port: 8070 — CONSOLIDATED 2026-05-09 onto frontdoor's server (same Qwen3.6-35B-A3B Q8
    # GGUF since the 2026-05-06 swap). Roles differ only by prompt modifier; serving
    # infrastructure is identical. Eliminates 36 GB duplicate mlock + a competing 96-thread
    # OMP team. The dedicated 8071 server is no longer launched.
    url: http://localhost:8070
    port: 8070
    slots: 1
    # Same chat_template_kwargs as frontdoor — shares the same GGUF (Qwen3.6-35B Q8)
    # and the same degenerate-thinking failure mode at chat-completions defaults.
    chat_template_kwargs:
      enable_thinking: false
    model_role: qwen36_q8_0
    description: Coding escalation — Qwen3.6-35B-A3B Q8 (May-6 swap; shares GGUF with frontdoor; 97% coder vs 77% on Qwen3-Coder-30B-A3B; REAP-246B 70% architect_coding eliminated)
    model: Qwen_Qwen3.6-35B-A3B-Q8_0.gguf
    model_path: /mnt/raid0/llm/models/Qwen_Qwen3.6-35B-A3B-Q8_0.gguf
    # No draft model — pure MoE; spec decode worth investigating but unverified
    kv_quant: {k: q8_0, v: q8_0}
    memory_gb: 37  # shared mmap with frontdoor — net incremental cost ~0
    tier: hot
    acceleration:
      type: none  # Q8 baseline; revisit moe_expert_reduction after sweep
      lookup: false
      corpus_retrieval: true
    throughput: 24.3   # aggregate target (May-4 baseline; canonical recipe + preflight gate)
    previous_model: Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf  # swapped 2026-05-06 (frontdoor model dominates: +20pp coder vs Qwen3-Coder, +27pp coder vs REAP-246B; shares mmap with frontdoor)
    benchmark_score: "170/183 (93%)"  # same model as frontdoor; Claude-as-Judge May 4 6-suite
    benchmark_date: 2026-05-04

  worker:
    # Port: 8072 full-mode (PORT_MAP). Reconciled 2026-05-09 — was 8082.
    url: http://localhost:8072
    port: 8072
    slots: 1
    model_role: worker_general
    shared_with: [worker_math, toolrunner]
    description: Try-cheap-first worker — gemma4-26B-A4B Q4_K_M MTP (swapped 2026-05-08 from Qwen3-Coder-30B-A3B; tool_compliance 96% vs 78%, full suite 90% vs 84%)
    model: gemma-4-26B-A4B-it-Q4_K_M.gguf
    draft_model: gemma-4-26B-A4B-it-assistant-Q8_0.gguf  # in-house MTP drafter (4 layers); via ik_llama.cpp PR #1744
    memory_gb: 16
    tier: hot
    previous_model: Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf  # swapped 2026-05-08 (tool_compliance 96% vs 78%, +18pp). Pre-2026-03-21: Qwen2.5-7B-Instruct-f16.gguf.
    acceleration:
      type: speculative_decoding
      spec_type: mtp        # ik_llama.cpp gemma-mtp branch (PR #1744)
      draft_max: 2          # 58% acceptance on tier-3 prompts; matches 31B sibling tuning
      draft_p_min: 0.0      # greedy: accept top-1 drafts, verifier rejects mismatches
      threads_draft: 16     # dedicated drafter cores; ubatch 512 (MTP recipe)
      ubatch: 512
      lookup: false         # forbidden — MTP and ngram-simple lookup conflict on spec-decode slot
      corpus_retrieval: false
    runtime_requirements:
      binary_dir: /mnt/raid0/llm/ik_llama.cpp/build/bin    # PR #1744 patched build, NOT production llama.cpp
      ld_library_path:                                     # gemma-mtp branch needs its own libllama / libggml
      - /mnt/raid0/llm/ik_llama.cpp/build/src
      - /mnt/raid0/llm/ik_llama.cpp/build/ggml/src
      - /mnt/raid0/llm/ik_llama.cpp/build/examples/mtmd
    numa_instances: 4  # 4×48t NUMA quarters (2026-03-29 design retained; same RAM footprint).
    numa_ports: [8082, 8182, 8282, 8382]
    throughput: 60.7   # t/s per instance MTP-on (May-8 tool_compliance median); was 39.1 with Qwen3-Coder.

  # REAP-25B: Permanently pruned Qwen3-Coder-30B-A3B (25% experts removed by Cerebras REAP)
  # Pure MoE — speculative decoding IS viable (unlike Qwen3.5 hybrids)
  # Direct A/B comparison target: worker (same arch unpruned, 39.1 t/s)
  reap_25b:
    url: http://localhost:8196  # benchmark port, not production
    port: 8196
    slots: 1
    model_role: reap_25b_frontdoor
    description: REAP-pruned Qwen3-Coder-25B-A3B — 25% expert removal, pure MoE, spec decode viable
    model: cerebras_Qwen3-Coder-REAP-25B-A3B-Q4_K_M.gguf
    model_path: /mnt/raid0/llm/lmstudio/models/bartowski/cerebras_Qwen3-Coder-REAP-25B-A3B-GGUF/cerebras_Qwen3-Coder-REAP-25B-A3B-Q4_K_M.gguf
    draft_model: Qwen3-Coder-Instruct-DRAFT-0.75B-32k-Q4_0.gguf
    draft_model_path: /mnt/raid0/llm/models/Qwen3-Coder-Instruct-DRAFT-0.75B-32k-Q4_0.gguf
    memory_gb: 15
    tier: warm  # evaluation phase — promote to HOT if it replaces frontdoor/worker
    acceleration:
      type: speculative_decoding
      draft_max: 24   # Phase 1 optimal (39.6 t/s, matches unpruned worker) (same draft model) — sweep will optimize
      p_split: 0      # initial guess — sweep will test tree (ps=0.05) since pure MoE
      lookup: true     # pure MoE — lookup should be safe (not hybrid)
    throughput: 39.6   # Phase 1 measured 2026-03-24 (dm=24, ps=0, linear only)
    comparison_targets:
      - worker  # same arch unpruned (39.1 t/s) — measures REAP speed impact
      - frontdoor  # production replacement (12.7 t/s moe6) — measures deployment value

  # WARM tier - mmap preloaded, loaded on demand (~430GB total)
  architect_general:
    url: http://localhost:8083
    port: 8083
    slots: 2  # 2026-05-09: bumped from 1 to 2 to dodge llama.cpp speculative-tree-decode
              # GGML_ASSERT (`init: invalid seq_id[1][0] = 1 >= 1`) when n_seq_max=1 + draft_max>1.
              # Admission semantics still serial via router; -np 2 only affects KV slot count.
              # Cost: +~1 GB KV at 16K ctx. Throughput per request unchanged.
              # Driven by SERIAL_ROLES set in scripts/server/orchestrator_stack.py:318.
    # 2026-05-20: enable_thinking=false. Qwen3.5-122B-A10B's <think> loops are
    # particularly degenerate at chat-completions defaults — on simpleqa knowledge
    # questions it fills 4096 tokens with "Wait, I found a reference: ..." cycles
    # and emits zero content tokens (finish_reason=length, content="").
    # Without nothink: 6/15 (40%) cheap-kill accuracy. With nothink: 9/15 (60%).
    # Architect still trails frontdoor + gemma4 + ingest even with this fix —
    # candidate for wider 50-100-task deprecation gate.
    chat_template_kwargs:
      enable_thinking: false
    model_role: qwen35_122b_q4km
    description: System architecture — Qwen3.5-122B-A10B MoE (quality 2.57/3, -64GB vs 235B)
    # Phase 3 compliance gate (2026-05-07): aggressive passes — 117% baseline compliance,
    # 110% baseline procedure, recall 0.93. Compression actively helps this model.
    # Source: data/compliance/2026-05-07-architect_general-curve/SUMMARY.md.
    agent_file_compression_operating_point: aggressive
    model: Q4_K_M/Qwen3.5-122B-A10B-Q4_K_M-00001-of-00003.gguf
    draft_model: Qwen3.5-0.8B-Q8_0.gguf  # 0.8B Qwen3.5 draft (moe8+spec_q8_k8+lu = 12.6 t/s)
    memory_gb: 69
    tier: hot  # promoted from warm — half the RAM, fits NUMA node0
    # acceleration block REMOVED 2026-05-09 — moved to roles.architect_general.acceleration
    # (single source of truth). Previously this section disagreed with that one and
    # silently no-op'd because RegistryLoader reads from roles.X.acceleration.
    numa_instances: 1  # 1×96t canonical full-machine + c2 env (Probe B 2026-05-04)
    numa_ports: [8083]
    throughput: 12.19  # t/s single-instance canonical: numactl --interleave=all + taskset -c 0-95
                       # + GGML_NUMA_REPACK_INTERLEAVE=0 (n=5, σ ~0.4%, z ~3 vs default v5).
                       # +184% per-request latency vs prior 2× cross-NUMA (was 4.3 t/s/instance).
                       # Bundle: epyc-inference-research/data/cpu_optimization/2026-05-04-qwen35-122b-arch-probe/
                       # 4× per-NUMA-node 24t aggregate (16.86 t/s) is the throughput-optimal
                       # alternative — reopen ONLY if architect_general workload shifts to 4+ concurrent.
    previous_model: Qwen3-235B-A22B-Q4_K_M.gguf  # swapped 2026-03-19
    previous_wiring: 2x_cross_numa_8083_8183  # 4.3 t/s/instance (2026-03-29 → 2026-05-04)

  # architect_coding REMOVED 2026-05-06.
  # REAP-246B Q4_K_M scored only 7/10 (70%) on coder suite under canonical recipe,
  # WORSE than the consolidated worker (Qwen3-Coder-30B-A3B Q4 at 23/30 = 77%) AND
  # FAR worse than the frontdoor model (Qwen3.6-35B-A3B Q8 at 29/30 = 97%). Speed
  # was 6.35 t/s under canonical (May-4 Probe B) — 4× slower than the frontdoor.
  # The role's purpose ("hardest coding escalation") is no longer served by REAP-246B
  # because both frontdoor (97%) and worker (77%) outperform it on coder. Hard coding
  # escalations now route to frontdoor (Qwen3.6-35B-A3B Q8) via coder_escalation,
  # which shares its GGUF mmap with frontdoor. Saves 139 GB of warm-tier RAM.
  # Earlier MoE-Spec budget=40 plumbing (commit fee69b8) is retained in
  # orchestrator_stack.py _ROLE_ENV_BLOCKS but is now inert without an
  # architect_coding server entry to apply to.
  ingest_long_context:
    url: http://localhost:8085
    port: 8085
    slots: 1  # Serial — admission=1, no wasted KV
    model_role: ingest_long_context
    # 2026-05-30: router-target accuracy/long-context specialist, not the
    # two-stage summarization pipeline worker. The summarization path chunks
    # with worker_fast/worker_explore and synthesizes with frontdoor; telemetry
    # must not attribute those calls to this role.
    #
    # Thinking note: Qwen3-Next-80B's current GGUF template ignores
    # chat_template_kwargs.enable_thinking, so the lack of an override preserves
    # native model/template behavior rather than toggling a known switch. Earlier
    # cheap-kill A/Bs showed ingest quality sensitivity under changed prompting /
    # budgets, but should be treated as directional rather than a clean
    # thinking-off ablation. Trade-off: per-task wall time can stay high
    # (~50-150s), so route only accuracy-critical or genuinely long-context work.
    description: Accuracy-critical + long-context router specialist - SSM+MoE hybrid linear attention (NO speculation!)
    # Phase 3 compliance gate (2026-05-07): medium passes; aggressive fails procedure (89% baseline).
    # Compliance pinned at 0.933 across all 4 levels, recall 0.93-1.00. Source:
    # data/compliance/2026-05-07-ingest_long_context-curve/SUMMARY.md.
    agent_file_compression_operating_point: medium
    model: Qwen3-Next-80B-A3B-Q4_K_M.gguf
    memory_gb: 46
    tier: hot  # promoted from warm 2026-05-06 for router-target accuracy/long-context traffic.
    acceleration:
      type: moe_expert_reduction
      experts: 4  # MoE4 for quality (MoE2 degrades output)
      override_key: qwen3next.expert_used_count
    throughput: 14.4-20.8  # May-4 long_context bench at ~12K context. Pre-2026: 6.3 (10K context, MoE4) — older measurement.
    benchmark_score: "25/27 (93%) on canonical long_context suite, May-4"
    notes: "SSM-hybrid linear attention scales O(n) per token — at extreme contexts (50K+) outperforms pure-attention models. Best Stage-1 candidate for three_stage_summarization (full-context fast draft). Stage-2 review now uses frontdoor (Qwen3.6-35B-A3B Q8, 100% long_context)."

  # Voice recognition service (separate from LLM inference)
  voice_server:
    url: http://localhost:9000
    port: 9000
    model_role: voice_transcription
    description: Speech-to-text using faster-whisper (OpenAI-compatible API)
    model: large-v3-turbo
    model_type: whisper
    memory_gb: 4
    tier: hot
    languages: [en, it, de, fr]
    acceleration:
      type: int8_quantization
      vad_filter: true
      vad_min_silence_ms: 300
    throughput: 2.8  # RTF ~0.35x (2.8x real-time on CPU int8, verified 2026-01-16)
    latency_target_ms: 500
    launch_script: scripts/voice/start_whisper_server.sh
    managed_by: orchestrator_stack    # Promoted from sidecar 2026-05-06 (start_whisper in orchestrator_stack.py)
    health_path: /health
    health_timeout_sec: 60
    notes: "Python REST service (not llama.cpp). Stack-managed via start_whisper() in orchestrator_stack.py. Serves Aider, Claude Code, orchestrator."

  # ComfyUI diffusion-inference service (ERNIE-Image-Turbo Q8 GGUF + Mistral3 + flux2 VAE)
  # sd-server (stable-diffusion.cpp native ggml) — replaced ComfyUI 2026-05-07.
  # Q8 weights stay packed; native ggml quantized GEMM kernels skip ComfyUI-GGUF's
  # per-layer dequant-to-BF16 step. Measured ~1.74× wall-clock and ~3.43× sampler
  # s/iter speedup at 512² / 4 steps; expected ~2× wall-clock at production.
  sd_server:
    url: http://localhost:8190
    port: 8190
    model_role: image_generation
    description: sd-server (stable-diffusion.cpp native ggml) running ERNIE-Image-Turbo single-stream DiT
    model: ernie-image-turbo-Q8_0.gguf
    model_type: diffusion_service
    huggingface_id: unsloth/ERNIE-Image-Turbo-GGUF
    model_path: /mnt/raid0/llm/models/diffusion/ernie-image-turbo-gguf/ernie-image-turbo-Q8_0.gguf
    pipeline_components_dir: /mnt/raid0/llm/models/diffusion/ernie-image-turbo-comfy/
    text_encoder: ministral-3-3b.safetensors
    vae: flux2-vae.safetensors
    backend: stable-diffusion.cpp
    backend_binary: /mnt/raid0/llm/stable-diffusion.cpp/build/bin/sd-server
    memory_gb: 16
    tier: warm
    languages: [en, zh]
    acceleration:
      type: ggml_native_q8
      flash_attention: true
      numa_pinning: "interleave=all"
      threads: 96
    default_params:
      width: 1024
      height: 1024
      steps: 8
      cfg_scale: 1.0
      sampler: euler
      scheduler: simple
    throughput: 0.0247  # ~40 s/image @ 512² 4 steps on EPYC 9655 CPU (2026-05-07 A/B vs ComfyUI 70 s)
    launch_script: scripts/diffusion/start_sd_server.sh
    managed_by: orchestrator_stack
    health_path: /sdapi/v1/samplers
    health_timeout_sec: 120
    api_endpoint: /sdapi/v1/txt2img
    api_style: sd-webui-compatible
    notes: "Native C++/ggml inference. Synchronous HTTP. Replaces ComfyUI (still on disk at /mnt/raid0/llm/comfyui-ernie-test/ for rollback). The Ministral3 prompt-enhancer chain that ComfyUI's workflow ran in-graph is not yet wired through sd-server; short-prompt enhancement is currently a no-op."

  # Image generation virtual role (no llama-server backing — execution lives in the Hermes plugin)
  image_worker:
    tier: D
    description: Virtual role for image generation. No model server; TaskIRs handed to Hermes which calls comfyui via the local image_generate plugin.
    backend:
      type: virtual
    execution: hermes_plugin
    execution_target: image_generate
    notes: "Routing label only. Frontdoor classifies task_type=image -> primary_role=image_worker; orchestrator coordinator dispatches to Hermes."

  # Document processing service (llama.cpp GGUF - 19x faster than PyTorch)
  document_formalizer:
    url: http://localhost:9001
    port: 9001
    model_role: document_preprocessing
    description: PDF/document OCR with figure localization using llama.cpp
    model: LightOnOCR-2-1B-bbox-Q4_K_M.gguf
    mmproj: LightOnOCR-2-1B-bbox-mmproj-F16.gguf
    model_type: gguf_vlm
    huggingface_id: lightonai/LightOnOCR-2-1B-bbox
    model_path: /mnt/raid0/llm/models/LightOnOCR-2-1B-bbox-Q4_K_M.gguf
    mmproj_path: /mnt/raid0/llm/models/LightOnOCR-2-1B-bbox-mmproj-F16.gguf
    memory_gb: 10  # 8 workers × ~1.2 GB each
    tier: warm
    default_params:
      output_format: bbox
      max_pages: 100
      dpi: 200
    acceleration:
      type: worker_pool
      workers: 8
      threads_per_worker: 12
      notes: "More workers > more threads for throughput. 8×12 is 15% faster than 4×24."
    throughput: 0.17  # pages/sec on EPYC 9655 (8×12 config)
    baseline_throughput: 0.009  # PyTorch CPU baseline
    speedup: 19x  # vs PyTorch CPU
    launch_script: scripts/document/start_lightonocr_llama.sh
    launch_quirks:
      - "llama-mtmd-cli requires BOTH --image AND -p flags for non-interactive mode"
      - "Empty -p '' causes 'invalid argument' - use -p 'OCR' or similar"
      - "Vision encoding is fixed ~8s bottleneck regardless of thread count"
      - "BOS token is comma (,) - unusual but works correctly"
      - "Default context 16384 uses ~1.8 GB KV cache per worker"
    env_vars:
      LIGHTONOCR_WORKERS: "8"
      LIGHTONOCR_THREADS: "12"
      LIGHTONOCR_MAX_TOKENS: "2048"
      LIGHTONOCR_TIMEOUT: "300"  # Increased from 120s for complex pages
    notes: "GGUF conversion via llama.cpp (native LightOnOCR support). PyTorch version deprecated. Uses Pixtral vision encoder + Qwen3 text decoder."
    benchmark_date: 2026-01-24
    quirks:
      - "2026-01-24: Increased timeout from 120s to 300s - complex pages with figures can take 24-30s each"
      - "Use server-side /v1/document/pdf endpoint for PDFs - client-side per-page requests add HTTP overhead"

  # Multi-vector retrieval — dual containers (Phase 4)
  # Code and docs use separate models optimized for each content type.
  # Embeddings are model-specific and cannot be mixed across containers.
  nextplaid_code:
    url: http://localhost:8088
    port: 8088
    model_role: code_retrieval
    description: Multi-vector code search using ColBERT late interaction (code-optimized)
    model: lightonai/LateOn-Code
    model_type: onnx_int8
    docker_image: ghcr.io/lightonai/next-plaid:cpu-1.0.4
    memory_gb: 1.2  # ~1.2GB (Docker + 130M ONNX model + mmap'd indices)
    tier: always  # Starts with infrastructure, soft dependency
    indices: [code]
    health_endpoint: /health
    launch_command: >
      docker run -d --name nextplaid-code
      -p 8088:8080
      -v /mnt/raid0/llm/epyc-orchestrator/cache/next-plaid/code-indices:/data/indices
      -v /mnt/raid0/llm/cache/huggingface:/root/.cache/huggingface
      ghcr.io/lightonai/next-plaid:cpu-1.0.4
      --host 0.0.0.0 --port 8080 --index-dir /data/indices
      --model lightonai/LateOn-Code --int8
    reindex_command: python3 scripts/nextplaid/index_codebase.py --code-only
    notes: "LateOn-Code 130M, 128-dim token embeddings. +11.2% vs LateOn-Code-edge on MTEB Code (74.12 vs 66.64). AST-chunked code units."

  nextplaid_docs:
    url: http://localhost:8089
    port: 8089
    model_role: doc_retrieval
    description: Multi-vector doc search using ColBERT late interaction (text-optimized)
    model: lightonai/GTE-ModernColBERT-v1
    model_type: onnx_int8
    docker_image: ghcr.io/lightonai/next-plaid:cpu-1.0.4
    memory_gb: 0.5  # ~500MB (Docker + 149M ONNX INT8 model + mmap'd indices)
    tier: always
    indices: [docs]
    health_endpoint: /health
    launch_command: >
      docker run -d --name nextplaid-docs
      -p 8089:8080
      -v /mnt/raid0/llm/epyc-orchestrator/cache/next-plaid/docs-indices:/data/indices
      -v /mnt/raid0/llm/cache/huggingface:/root/.cache/huggingface
      ghcr.io/lightonai/next-plaid:cpu-1.0.4
      --host 0.0.0.0 --port 8080 --index-dir /data/indices
      --model lightonai/GTE-ModernColBERT-v1 --int8
    reindex_command: python3 scripts/nextplaid/index_codebase.py --docs-only
    notes: "GTE-ModernColBERT-v1 (149M, 128-dim, BEIR 54.67, LongEmbed 88.39). Upgraded from answerai-colbert-small-v1 (33M, 96-dim) on 2026-02-20. Uses [Q]/[D] prefixes (handled by container). A/B: 5/10 queries better, 0 worse. Latency 28→50ms."
    # Previous model: lightonai/answerai-colbert-small-v1-onnx (33M, 96-dim)
    # Rollback: swap --model flag and reindex. Index is dimension-specific (128 vs 96).

  # Development mode - single small model for all roles
  dev:
    frontdoor:
      url: http://localhost:8080
      slots: 4
      model: Qwen2.5-Coder-0.5B-Q8_0.gguf
      description: Dev frontdoor - fast small model
    worker:
      url: http://localhost:8082
      slots: 4
      model: Qwen2.5-Coder-0.5B-Q8_0.gguf
      description: Dev worker - fast small model

# =============================================================================
# Worker Pool Configuration (Heterogeneous parallel workers)
# =============================================================================
worker_pool:
  # ============================================================================
  # DEPRECATED 2026-05-06 — config dormant; not invoked by production stack.
  # ============================================================================
  # The heterogeneous worker pool was a 2025-Q4 / 2026-Q1 design predating the
  # 2026-03-19 worker_general consolidation onto Qwen3-Coder-30B-A3B Q4 (NUMA
  # 4×48t). It is no longer matched to the production stack.
  #
  # Three independent reasons for deprecation:
  #
  # 1. GGUF FILES NOT ON DISK. The two HOT workers reference paths that do not
  #    exist:
  #      - explore: Qwen/Qwen2.5-7B-Instruct-GGUF/Qwen2.5-7B-Instruct-Q4_K_M.gguf
  #      - code:    Qwen/Qwen2.5-Coder-7B-Instruct-GGUF/Qwen2.5-Coder-7B-Instruct-Q4_K_M.gguf
  #    The WARM worker references Qwen2.5-Coder-1.5B-Instruct-Q8_0.gguf which is
  #    also not on disk (only Q4_K_M and Q2_K of that family are available, in
  #    QuantFactory/, not the path the registry references). If anyone enabled
  #    this config, all 3 workers would fail with ENOENT at launch.
  #
  # 2. CANONICAL-RECIPE QUALITY DATA IS DECISIVE. From benchmarks/results/
  #    reviews/summary.csv (May-2/4 sweep):
  #      - explore proxy (Qwen2.5-7B Q4_K_S):    27/61 (44%) — −40pp vs worker_general
  #      - code    (Qwen2.5-Coder-7B Q4):        UNTESTED (file missing)
  #      - fast proxy (Qwen2.5-Coder-1.5B Q4_K_M): 4/20 (20%) on partial — −64pp+
  #      - worker_general (Qwen3-Coder-30B-A3B Q4): 153/183 (84%) on full battery
  #    Even the most generous estimate for Qwen2.5-Coder-7B (~60%) loses to
  #    worker_general by ≥24pp on quality.
  #
  # 3. WORKER_GENERAL ALREADY SERVES THE PARALLEL-WORK USE CASE. NUMA 4×48t
  #    deployment provides 4-way concurrency at ~156 t/s aggregate
  #    (4 instances × 43.4 t/s). Sufficient for production worker traffic.
  #    `fast`'s theoretical 4-slot 340 t/s aggregate (at 20% quality) is not a
  #    real win.
  #
  # CODE STATUS: src/services/worker_pool.py is RETAINED as dormant
  # infrastructure. It is gated by use_worker_pool=False default in
  # src/llm_primitives/primitives.py. No code changes — only this config flip.
  # If a future use case emerges (different small models, GPU tiering, etc.)
  # the WorkerPoolManager can be revived by re-enabling here and adding active
  # GGUFs.
  #
  # ============================================================================
  enabled: false  # was true; deprecated 2026-05-06
  description: "DEPRECATED 2026-05-06 — superseded by worker_general (Qwen3-Coder-30B-A3B Q4) NUMA 4×48t consolidation. See deprecation notes above."
  prompt_lookup: true  # would enable ngram lookup for all workers if revived

  # Scaling parameters
  expansion_threshold: 4  # Concurrent tasks to trigger WARM expansion
  warm_timeout_seconds: 300  # Shutdown idle WARM workers after 5 minutes
  health_check_interval: 30

  # Model paths
  model_base_path: /mnt/raid0/llm/lmstudio/models

  workers:
    # === HOT WORKERS (DEPRECATED — GGUFs not on disk; canonical-recipe quality 44% << worker_general 84%) ===
    explore:
      port: 8082
      model: Qwen/Qwen2.5-7B-Instruct-GGUF/Qwen2.5-7B-Instruct-Q4_K_M.gguf  # NOT ON DISK
      tier: hot
      threads: 24
      slots: 2
      memory_gb: 4.4
      task_types: [explore, summarize, understand]
      description: "DEPRECATED 2026-05-06 — Directory crawling, file summaries, codebase understanding. Canonical-recipe quality 27/61 (44%) on Qwen2.5-7B Q4_K_S; underperforms worker_general by 40pp."
      expected_tps: 15

    code:
      port: 8092
      model: Qwen/Qwen2.5-Coder-7B-Instruct-GGUF/Qwen2.5-Coder-7B-Instruct-Q4_K_M.gguf  # NOT ON DISK
      tier: hot
      threads: 24
      slots: 2
      memory_gb: 4.4
      task_types: [code_impl, refactor, test_gen]
      description: "DEPRECATED 2026-05-06 — Code implementation. UNTESTED — GGUF file missing on disk. Family-scaling estimate puts quality below worker_general (Qwen3-Coder-30B-A3B Q4, 84% / 77% on coder)."
      expected_tps: 18

    # === WARM WORKER (DEPRECATED — Q8 GGUF not on disk; Q4_K_M proxy 20% on partial) ===
    fast:
      port: 8102
      model: Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF/Qwen2.5-Coder-1.5B-Instruct-Q8_0.gguf  # NOT ON DISK
      tier: warm
      threads: 16
      slots: 4
      memory_gb: 1.0
      task_types: [boilerplate, transform, parallel_burst]
      description: "DEPRECATED 2026-05-06 — Simple transformations, boilerplate, parallel-burst. Canonical-recipe Q4 proxy: 4/20 (20%) on think+gen; too weak even for trivial tasks. Q8 GGUF not on disk."
      expected_tps: 60

  launch_flags:
    - "--flash-attn on"
    - "--lookup-ngram-min 3"

  resource_summary:
    hot_memory_gb: 8.8  # 2 × 4.4GB (would have been; not actually allocated since deprecation)
    warm_memory_gb: 2.0  # 2 × 1.0GB
    hot_threads: 48  # 2 × 24
    warm_threads: 24  # 2 × 12
    total_slots: 8  # 4 workers × 2 slots
    deprecation_savings: "9.8 GB hot tier reclaimed (vs hypothetical active deployment); production already running without worker_pool enabled."

  notes: |
    DEPRECATED 2026-05-06.
    Original design (2025-Q4 / 2026-Q1):
    - HOT workers (7B) provide quality for complex tasks
    - WARM workers (1.5B) provide 4x speed for simple tasks
    - WARM workers spin up automatically when parallelism > 4
    - Prompt lookup enabled by default for all workers

    Superseded by worker_general consolidation (2026-03-19 onto Qwen3-Coder-30B-A3B
    Q4_K_M, NUMA 4×48t, 84% canonical-recipe quality at ~156 t/s aggregate
    throughput).

    Integration code retained: src/services/worker_pool.py (gated off via
    use_worker_pool=False default in primitives.py).

roles:
  # =============================================================================
  # LOCAL ROLES (llama.cpp inference)
  # =============================================================================
  # All local roles use backend.type: local (default if not specified)
  # External API roles (anthropic, openai) defined at end of roles section
  # =============================================================================

  frontdoor:
    tier: A
    description: Root LM — Qwen3.6-35B-A3B Q8 (quality 93%, May-4 Claude-as-Judge 170/183)
    backend:
      type: local
    model:
      name: Qwen3.6-35B-A3B-Q8_0
      path: /mnt/raid0/llm/models/Qwen_Qwen3.6-35B-A3B-Q8_0.gguf
      quant: Q8_0
      size_gb: 37
      architecture: qwen35moe
      previous_model: Qwen3.5-35B-A3B-UD-Q4_K_M (swapped 2026-05-04; +11pp, +80% t/s under canonical)
      use_chat_api: true
      disable_thinking: true  # Unsloth recommended; thinking off for routing/agentic
      reasoning: auto
      max_tokens_multiplier: 4
    candidate_roles:
    - frontdoor
    - coder
    - general
    - ingest
    acceleration:
      type: none  # Q8 baseline; expert_reduction sweep deferred
      lookup: false
    performance:
      baseline_tps: 24.3  # May-4 canonical baseline aggregate
      optimized_tps: 24.3
      quality_pct: 93  # 170/183 May-4 Claude-as-Judge 6-suite under canonical recipe
      benchmark_date: 2026-05-04
    memory:
      residency: hot
      pinned: true
    tool_permissions:
      web_access: true
      allowed_categories: [web, file, data]
    generation_defaults:
      n_tokens: -1
      temperature: 0.3
    system_prompt_suffix: |
      Provide clear, user-friendly explanations.
      Elaborate on specialist outputs when presenting to users.
      Be direct — avoid filler, repetition, and unnecessary preamble.
  coder_escalation:
    tier: B
    description: Coding escalation — Qwen3.6-35B-A3B Q8 MoE (May-6 swap; same model as frontdoor, shares GGUF mmap; absorbs eliminated architect_coding role)
    model:
      name: Qwen3.6-35B-A3B-Q8_0
      path: /mnt/raid0/llm/models/Qwen_Qwen3.6-35B-A3B-Q8_0.gguf
      quant: Q8_0
      size_gb: 37
      architecture: qwen35moe
      previous_model: Qwen3-Coder-30B-A3B-Instruct-Q4_K_M (swapped 2026-05-06; +20pp coder, beats REAP-246B by 27pp)
      use_chat_api: true
      disable_thinking: true
      reasoning: auto
      max_tokens_multiplier: 4
    candidate_roles:
    - coder
    - general
    acceleration:
      type: none  # Q8 baseline (matches frontdoor); revisit moe_expert_reduction after sweep
      lookup: false
    performance:
      baseline_tps: 24.3  # May-4 canonical (matches frontdoor)
      optimized_tps: 24.3
      quality_pct: 93  # 170/183 May-4 Claude-as-Judge (same model as frontdoor)
      coder_suite: "29/30 (97%)"
      agentic_suite: "26/30 (87%)"
      math_suite: "29/30 (97%)"
      speedup: shares_frontdoor_gguf
    memory:
      residency: hot  # shares mmap with frontdoor (same GGUF)
      pinned: true
    escalation_from: frontdoor
    use_cases:
    - First failure from frontdoor on code tasks (separate slot)
    - Multi-file refactoring requiring broader context
