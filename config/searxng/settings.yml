# SearXNG settings for EPYC orchestrator backend use
# See: https://docs.searxng.org/admin/settings/
# Intake reference: intake-359/360 in epyc-root/research/intake_index.yaml

use_default_settings: true

server:
  secret_key: "epyc-orchestrator-searxng-local-backend-2026"
  bind_address: "0.0.0.0"
  limiter: false              # MUST be false — API_MAX=4/hr blocks programmatic use
  public_instance: false
  image_proxy: false
  method: "GET"

search:
  formats:
    - html
    - json                    # MUST be present or JSON API returns 403
  default_lang: "en"
  safe_search: 0

outgoing:
  request_timeout: 3.0
  max_request_timeout: 10.0
  enable_http2: true

# Engine tuning (SX-3): disable Google (TLS fingerprinting blocks SearXNG).
# WS1 (2026-06-22): our egress IP is blocked by duckduckgo (CAPTCHA), qwant
# (access denied) and startpage (Suspended: CAPTCHA). Those engines only waste
# request time and surface CAPTCHA noise in unresponsive_engines, so they are
# disabled here. bing is the reliable workhorse from this egress; wikipedia is
# healthy (no errors); brave is kept best-effort (intermittently rate-limited).
engines:
  - name: google
    engine: google
    shortcut: go
    inactive: true            # Completely removed — TLS fingerprint blocking (issue #2515)

  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: true            # WS1: egress IP blocked (CAPTCHA)
    timeout: 3.0

  - name: qwant
    engine: qwant
    shortcut: qw
    disabled: true            # WS1: egress IP blocked (access denied)
    timeout: 3.0

  - name: startpage
    engine: startpage
    shortcut: sp
    disabled: true            # WS1: egress IP blocked (Suspended: CAPTCHA)
    timeout: 3.0

  - name: brave
    engine: brave
    shortcut: br
    disabled: false
    weight: 1.1               # Best-effort — intermittently rate-limited from this egress
    timeout: 3.0

  - name: bing
    engine: bing
    shortcut: bi
    disabled: false
    weight: 1.2               # Primary — reliably returns results from this egress
    timeout: 3.0

  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false
    weight: 1.0
    timeout: 3.0
